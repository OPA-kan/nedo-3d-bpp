name: Task B benchmark

on:
  workflow_call:
    inputs:
      selection_mode:
        description: Pool-aware candidate selection mode
        required: false
        type: string
        default: weighted
  workflow_dispatch:
    inputs:
      selection_mode:
        description: Pool-aware candidate selection mode
        required: true
        type: choice
        options:
          - weighted
          - depth2
          - pool_resilience
        default: weighted

permissions:
  contents: read

concurrency:
  group: task-b-benchmark-${{ github.ref }}-${{ inputs.selection_mode }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: pool-${{ matrix.look_ahead }}-${{ inputs.selection_mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        look_ahead:
          - 3
          - 10
          - 20
          - 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build Task B config
        run: >-
          python scripts/build_task_b_config.py
          --look-ahead "${{ matrix.look_ahead }}"
          --policy-timeout 8
          --output
          "reports/task-b/config-k${{ matrix.look_ahead }}.json"
      - name: Run Task B benchmark
        run: >-
          python scripts/run_checks.py
          --simulator
          --simulator-mode benchmark
          --config
          "reports/task-b/config-k${{ matrix.look_ahead }}.json"
        env:
          LOOKAHEAD_SELECTION_MODE: ${{ inputs.selection_mode }}
          NEDO_POLICY_TRACE_PATH: >-
            ${{ github.workspace }}/reports/raw/policy-trace.jsonl
      - name: Publish compact summary
        if: always()
        run: |
          python scripts/summarize_task_b.py \
            reports/latest.json \
            --look-ahead "${{ matrix.look_ahead }}" \
            --selection-mode "${{ inputs.selection_mode }}" \
            --output \
              "reports/task-b/summary-k${{ matrix.look_ahead }}.md"
          cat \
            "reports/task-b/summary-k${{ matrix.look_ahead }}.md" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: >-
            task-b-k${{ matrix.look_ahead }}-${{ inputs.selection_mode }}
          path: |
            reports/latest.md
            reports/latest.json
            reports/raw/
            reports/task-b/

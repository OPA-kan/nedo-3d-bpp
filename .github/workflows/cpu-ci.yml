name: CPU verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_simulator:
        description: Run the full PyBullet sample simulator
        required: false
        type: boolean
        default: true
      run_task_b:
        description: Run the Task B look-ahead matrix
        required: false
        type: boolean
        default: false
      selection_mode:
        description: Task B pool-aware candidate selection mode
        required: false
        type: choice
        options:
          - weighted
          - depth2
          - pool_resilience
        default: weighted
      coverage_mode:
        description: Task B visible-pool coverage mode
        required: false
        type: choice
        options:
          - class_aware
          - legacy
        default: class_aware
      risk_gate_mode:
        description: Task B release risk gate ablation mode
        required: false
        type: choice
        options:
          - all
          - "off"
          - shadow
          - enforce
        default: all

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            reports/latest.md
            reports/latest.json

  # The unit-tests job installs numpy only, so the replay integration tests
  # skip there. They assert the physics-isolation contract of the
  # counterfactual replay, which cannot be left unproven on a normal push --
  # NEDO_REQUIRE_INTEGRATION turns a skip into a failure so this job cannot
  # go green without actually running them.
  replay-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Replay physics isolation
        run: python -m unittest tests.test_replay_integration -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"

  simulator-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - run: >-
          python scripts/run_checks.py
          --simulator
          --simulator-mode benchmark
        env:
          OFFLINE_SEARCH_BUDGET_SECONDS: "150"
          NEDO_POLICY_TRACE_PATH: >-
            ${{ github.workspace }}/reports/raw/policy-trace.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-report
          path: |
            reports/latest.md
            reports/latest.json
            reports/raw/

  task-b-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_task_b
    permissions:
      contents: write
    uses: ./.github/workflows/task-b-benchmark.yml
    with:
      selection_mode: ${{ inputs.selection_mode }}
      coverage_mode: ${{ inputs.coverage_mode }}
      risk_gate_mode: ${{ inputs.risk_gate_mode }}

  rescue-scan-ablation:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/experiment/rescue-scan' &&
      !contains(github.event.head_commit.message, '[skip rescue]')
    uses: ./.github/workflows/rescue-scan-ablation.yml

  cross-step-incumbent-ablation:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/experiment/cross-step-incumbent' &&
      !contains(github.event.head_commit.message, '[skip cross-step]')
    permissions:
      contents: write
    uses: ./.github/workflows/cross-step-incumbent-ablation.yml

  visible-pool-rollout-ablation:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/experiment/visible-pool-rollout' &&
      !contains(github.event.head_commit.message, '[skip rollout]')
    permissions:
      contents: write
    uses: ./.github/workflows/visible-pool-rollout-ablation.yml

  task-a-rollout-transfer:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/experiment/task-a-rollout-transfer' ||
       github.ref ==
       'refs/heads/claude/task-a-rollout-bounded128-dneq4n') &&
      !contains(github.event.head_commit.message, '[skip task-a]')
    permissions:
      contents: write
    uses: ./.github/workflows/task-a-rollout-transfer.yml

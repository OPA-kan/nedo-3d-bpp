name: CPU verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_simulator:
        description: Run the full PyBullet sample simulator
        required: false
        type: boolean
        default: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            reports/latest.md
            reports/latest.json

  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.run_simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - run: python scripts/run_checks.py --simulator
        env:
          OFFLINE_SEARCH_BUDGET_SECONDS: "150"
          NEDO_POLICY_TRACE_PATH: >-
            ${{ github.workspace }}/reports/raw/policy-trace.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-report
          path: |
            reports/latest.md
            reports/latest.json
            reports/raw/

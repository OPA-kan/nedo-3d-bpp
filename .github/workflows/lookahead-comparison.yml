name: Lookahead score comparison

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/preview-score-comparison

permissions:
  contents: write

concurrency:
  group: lookahead-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-simulator.txt
      - run: python scripts/run_checks.py
      - name: Run same-commit comparison
        run: python scripts/compare_lookahead.py --run-id "${{ github.run_id }}"
        env:
          OFFLINE_SEARCH_BUDGET_SECONDS: "150"
      - name: Publish comparison table
        if: always()
        run: |
          if [ -f reports/lookahead/latest-summary.md ]; then
            cat reports/lookahead/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist compact comparison history
        if: always()
        run: |
          if [ -f reports/lookahead/latest-summary.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              reports/lookahead/latest-summary.json \
              reports/lookahead/latest-summary.md \
              "reports/lookahead/history/${{ github.run_id }}/summary.json" \
              "reports/lookahead/history/${{ github.run_id }}/summary.md"
            if ! git diff --cached --quiet; then
              git commit -m "Record lookahead comparison run ${{ github.run_id }} [skip ci]"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookahead-score-history
          path: reports/lookahead/
      - name: Archive raw output to Drive
        if: always()
        uses: ./.github/actions/archive-to-drive
        with:
          source: |
            reports/lookahead
          remote: lookahead/${{ github.run_id }}
          pointer: >-
            reports/lookahead/history/${{ github.run_id }}/drive.json
          credentials: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          commit: "true"


name: Single-agent H2 multi-head V shadow

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Full-batch epochs per ensemble member
        required: false
        default: "120"
      max_roots:
        description: Roots per matrix cell
        required: false
        default: "2"
  push:
    branches: [work/terminal-rollout-oracle]
    paths:
      - .github/workflows/single-agent-value-shadow.yml
      - scripts/build_single_agent_value_dataset.py
      - scripts/train_self_play_set_value.py
      - scripts/run_vector_mcts.py
      - scripts/aggregate_single_agent_value_shadow.py
      - tests/test_build_single_agent_value_dataset.py
      - tests/test_train_self_play_set_value.py
      - tests/test_vector_mcts_and_beta.py
      - tests/test_aggregate_single_agent_value_shadow.py

permissions:
  contents: read
  actions: read

jobs:
  train-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-learning.txt
      - run: pip install -r requirements.txt -r requirements-learning.txt
      - name: Verify single-agent dataset and model contracts
        run: >-
          python -m unittest
          tests.test_build_single_agent_value_dataset
          tests.test_train_self_play_set_value
          -v
      - name: Build leakage-audited single-agent suffix dataset
        run: >-
          python scripts/build_single_agent_value_dataset.py
          --root reports/self-play-paired-physical/p3a-collection-20260823
          --output reports/single-agent-value/dataset.jsonl
          --summary reports/single-agent-value/dataset-summary.json
      - name: Train group-held-out Set Transformer ensemble
        run: >-
          python scripts/train_self_play_set_value.py
          --dataset reports/single-agent-value/dataset.jsonl
          --output-dir reports/single-agent-value/model
          --ensemble-size 3
          --epochs "${{ inputs.epochs || '120' }}"
          --folds 5
          --seed 20260824
      - uses: actions/upload-artifact@v4
        with:
          name: single-agent-value-model-${{ github.run_id }}
          path: reports/single-agent-value/

  physical-shadow:
    needs: train-value
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: dual-empty-original, scenario: dual-empty, stream: original}
          - {cell: dual-preloaded-dedicated-source-001, scenario: dual-preloaded-dedicated, stream: source-001}
          - {cell: dual-shelf-mixed-source-001, scenario: dual-shelf-mixed, stream: source-001}
          - {cell: single-empty-noshelf-original, scenario: single-empty-noshelf, stream: original}
          - {cell: single-empty-shelf-original, scenario: single-empty-shelf, stream: original}
          - {cell: single-preloaded-original, scenario: single-preloaded, stream: original}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-simulator.txt
            requirements-learning.txt
      - run: pip install -r requirements-simulator.txt -r requirements-learning.txt
      - uses: actions/download-artifact@v4
        with:
          name: single-agent-value-model-${{ github.run_id }}
          path: reports/single-agent-value
      - name: Verify value-shadow and physical contracts
        run: >-
          python -m unittest
          tests.test_vector_mcts_and_beta
          tests.test_aggregate_single_agent_value_shadow
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e
          -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Rebuild frozen scenario
        run: >-
          python scripts/build_scenario_matrix.py
          --stream-variant "${{ matrix.stream }}"
          --output-dir reports/value-shadow/configs
      - name: Run fixed-PUCT H2+0 and H2+V
        shell: bash
        run: |
          set -euo pipefail
          out="reports/value-shadow/${{ matrix.cell }}"
          mkdir -p "$out"
          common=(
            --config "reports/value-shadow/configs/${{ matrix.scenario }}.json"
            --case "m-${{ matrix.scenario }}"
            --environment-seed 42
            --manifest "reports/self-play-paired-physical/p3a-collection-20260823/${{ matrix.cell }}/manifest.json"
            --attempt-budget 128 --deep-top-k 3 --expansions 10 --max-depth 2
            --max-roots "${{ inputs.max_roots || '2' }}"
            --terminal-audit --allocation pareto-puct --c-puct 2.0
            --rollout-top-k 3 --rollout-max-steps 40
          )
          python scripts/run_vector_mcts.py "${common[@]}" \
            --leaf-eval measured --output "$out/zero.json"
          python scripts/run_vector_mcts.py "${common[@]}" \
            --leaf-eval value \
            --leaf-vector-model-dir reports/single-agent-value/model \
            --output "$out/value.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-agent-value-cell-${{ matrix.cell }}
          path: reports/value-shadow/${{ matrix.cell }}/

  aggregate:
    needs: physical-shadow
    if: always() && needs.physical-shadow.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          pattern: single-agent-value-cell-*
          path: reports/value-shadow/results
      - name: Aggregate terminal-scored leaf-value effect
        run: >-
          python scripts/aggregate_single_agent_value_shadow.py
          --root reports/value-shadow/results
          --expected-cells 6
          --json-output reports/value-shadow/aggregate.json
          --markdown-output reports/value-shadow/aggregate.md
      - run: cat reports/value-shadow/aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-agent-value-shadow-${{ github.run_id }}
          path: reports/value-shadow/

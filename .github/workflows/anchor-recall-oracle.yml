name: Anchor recall oracle

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/anchor-recall-oracle

permissions:
  contents: write

concurrency:
  group: anchor-recall-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-simulator.txt
      - run: python scripts/run_checks.py
      - name: Measure Case 000 failure-step oracle
        run: |
          python scripts/measure_anchor_recall.py \
            --case 000 \
            --steps 13 14 \
            --mode weighted \
            --output-dir \
              "reports/anchor-recall/history/${{ github.run_id }}/case-000"
      - name: Measure Case 001 failure-step oracle
        run: |
          python scripts/measure_anchor_recall.py \
            --case 001 \
            --steps 9 10 \
            --mode weighted \
            --output-dir \
              "reports/anchor-recall/history/${{ github.run_id }}/case-001"
      - name: Persist compact oracle result
        if: always()
        run: |
          result_dir="reports/anchor-recall/history/${{ github.run_id }}"
          if compgen -G "$result_dir/case-*/summary.json" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$result_dir"/case-*/summary.json
            git add "$result_dir"/case-*/step-*-summary.json
            if ! git diff --cached --quiet; then
              git commit \
                -m "Record anchor recall run ${{ github.run_id }} [skip ci]"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-recall-${{ github.run_id }}
          path: reports/anchor-recall/history/${{ github.run_id }}/

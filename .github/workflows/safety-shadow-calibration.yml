name: Safety shadow calibration

on:
  workflow_dispatch:
  push:
    branches:
      - claude/v5-hypothesis-validation-cyna2c
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/safety-shadow-calibration.yml

permissions:
  contents: read

concurrency:
  group: safety-shadow-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  episode:
    name: ${{ matrix.case.case_id }}-r${{ matrix.replicate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replicate: [0, 1, 2]
        case:
          - case_id: b000-k15
            source_case: "000"
            look_ahead: 15
          - case_id: b000-k20
            source_case: "000"
            look_ahead: 20
          - case_id: b000-k40
            source_case: "000"
            look_ahead: 40
          - case_id: b001-k20
            source_case: "001"
            look_ahead: 20
          - case_id: b001-k30
            source_case: "001"
            look_ahead: 30
          - case_id: c000-k1
            source_case: "000"
            look_ahead: 1
          - case_id: c001-k1
            source_case: "001"
            look_ahead: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build development config
        run: >-
          python scripts/build_task_b_config.py
          --source-case "${{ matrix.case.source_case }}"
          --task-id "${{ matrix.case.case_id }}"
          --look-ahead "${{ matrix.case.look_ahead }}"
          --policy-timeout 8
          --output "reports/state-model/calibration/${{ matrix.case.case_id }}.json"
      - name: Run shadow-instrumented base episode
        env:
          # Absolute path: the simulator process runs with cwd simulator/
          # and the shadow loader opens the path as given.
          SAFETY_RERANK_SHADOW: >-
            ${{ github.workspace }}/reports/state-model/candidate-mlp-safety-v1.json
        run: >-
          python scripts/run_risk_ablation.py
          --config "reports/state-model/calibration/${{ matrix.case.case_id }}.json"
          --arm base
          --repeat "${{ matrix.replicate }}"
          --output-dir
          "reports/state-model/calibration/${{ matrix.case.case_id }}-base-r${{ matrix.replicate }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: >-
            safety-shadow-${{ matrix.case.case_id }}-r${{ matrix.replicate }}
          path: >-
            reports/state-model/calibration/${{ matrix.case.case_id }}-base-r${{ matrix.replicate }}/

  aggregate:
    needs: episode
    if: always() && needs.episode.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: safety-shadow-*
          path: reports/state-model/calibration/downloads
      - name: Analyze calibration
        run: |
          mkdir -p reports/state-model/calibration/aggregate
          python scripts/analyze_safety_shadow.py \
            --input-dir reports/state-model/calibration/downloads \
            --output reports/state-model/calibration/aggregate/calibration.json \
            --markdown reports/state-model/calibration/aggregate/calibration.md
          cat reports/state-model/calibration/aggregate/calibration.md \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: safety-shadow-aggregate
          path: reports/state-model/calibration/aggregate/

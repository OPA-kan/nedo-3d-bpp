# stage 1: enforce A/B (visible-tree-search-protocol.md)
name: Tree search stage0

on:
  workflow_dispatch:
  push:
    branches:
      - claude/v5-hypothesis-validation-cyna2c
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/tree-search-stage0.yml

permissions:
  contents: read

concurrency:
  group: tree-stage0-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  episode:
    name: ${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [base, tree_null, tree_search]
        replicate: [0, 1, 2]
        case:
          - case_id: b000-k15
            source_case: "000"
            look_ahead: 15
          - case_id: b000-k20
            source_case: "000"
            look_ahead: 20
          - case_id: b000-k40
            source_case: "000"
            look_ahead: 40
          - case_id: b001-k20
            source_case: "001"
            look_ahead: 20
          - case_id: b001-k30
            source_case: "001"
            look_ahead: 30
          - case_id: c000-k1
            source_case: "000"
            look_ahead: 1
          - case_id: c001-k1
            source_case: "001"
            look_ahead: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build development config
        run: >-
          python scripts/build_task_b_config.py
          --source-case "${{ matrix.case.source_case }}"
          --task-id "${{ matrix.case.case_id }}"
          --look-ahead "${{ matrix.case.look_ahead }}"
          --policy-timeout 8
          --output "reports/hazard/tree-stage0/${{ matrix.case.case_id }}.json"
      - name: Run paired-arm episode member
        run: >-
          python scripts/run_risk_ablation.py
          --config "reports/hazard/tree-stage0/${{ matrix.case.case_id }}.json"
          --arm "${{ matrix.arm }}"
          --repeat "${{ matrix.replicate }}"
          --output-dir
          "reports/hazard/tree-stage0/${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: >-
            tree-stage0-${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}
          path: >-
            reports/hazard/tree-stage0/${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}/

  aggregate:
    needs: episode
    if: always() && needs.episode.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-stage0-*
          path: reports/hazard/tree-stage0/downloads
      - name: Combine, summarize, adjudicate
        run: |
          mkdir -p reports/hazard/tree-stage0/aggregate
          find reports/hazard/tree-stage0/downloads -name rows.jsonl \
            -type f -exec cat {} + \
            > reports/hazard/tree-stage0/aggregate/rows.jsonl
          python scripts/run_risk_ablation.py \
            --summarize \
            --output-dir reports/hazard/tree-stage0/aggregate
          python scripts/adjudicate_safety_rerank.py \
            --rows reports/hazard/tree-stage0/aggregate/rows.jsonl \
            --baseline reports/benchmarks/baseline.json \
            --output reports/hazard/tree-stage0/aggregate/adjudication.json \
            --markdown reports/hazard/tree-stage0/aggregate/adjudication.md || true
          cat reports/hazard/tree-stage0/aggregate/adjudication.md \
            >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: tree-stage0-aggregate
          path: reports/hazard/tree-stage0/aggregate/

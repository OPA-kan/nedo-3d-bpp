name: Deviation-trigger branch-label corpus

on:
  workflow_dispatch:
  push:
    branches:
      - claude/v5-hypothesis-validation-cyna2c
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/deviation-corpus.yml

permissions:
  contents: read

concurrency:
  group: deviation-corpus-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  labels:
    name: syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source_case: ["000", "001"]
        variant: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build permuted pool-1 stream variants
        run: >-
          python scripts/build_stream_variants.py
          --source-case "${{ matrix.source_case }}"
          --look-ahead 1
          --variants 6
          --output-dir "reports/deviation-corpus/variants-${{ matrix.source_case }}"
      - name: Run each sibling branch to the end of the episode
        run: >-
          python scripts/build_branch_labels.py
          --config "reports/deviation-corpus/variants-${{ matrix.source_case }}/syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k1.json"
          --step 2 --step 4 --step 6 --step 8 --step 10 --step 12
          --step 14 --step 16
          --siblings 3
          --sibling-budget 4096
          --sibling-mode top_candidates
          --output-dir "reports/deviation-corpus/syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deviation-corpus-syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k1
          path: reports/deviation-corpus/syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k1/

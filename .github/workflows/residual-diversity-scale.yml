name: Residual-state diversity condition matrix

on:
  workflow_dispatch:
    inputs:
      observed_swap_rounds:
        description: >-
          Observed-state swap rounds for the safe-positive portfolio.
          0 dispatches the unseeded greedy construction as the ablation arm.
        required: false
        type: string
        default: "64"
      steps:
        description: >-
          Space-separated target steps per scenario. More steps means more
          distinct states per run; later steps cost more replay time because
          the board holds more items.
        required: false
        type: string
        default: "3 6 9 12 15 18"
  push:
    branches:
      - experiment/residual-diversity-dataset
      - claude/observed-state-swap-optimizer-lk8m0p

permissions:
  contents: read

concurrency:
  # Per-run, i.e. no grouping at all. Two earlier attempts at this were both
  # wrong. Grouping with cancel-in-progress killed a measurement mid-flight
  # when a push whose jobs all skipped entered the group -- the skip guard is
  # a job-level `if` while cancellation is run-level -- and that is how
  # 31391424126 lost single-empty-noshelf and committed a partial corpus.
  # Turning cancellation off did not fix it either: a group holds at most one
  # PENDING run, so dispatching three runs to accumulate states cancelled two
  # of them (31394867759 and 31394879139) before they started.
  #
  # Runs are measurements and must never cancel each other. The reason a
  # group existed at all was the shared push at the end, and that is handled
  # where it happens, by rebase-and-retry in the aggregate job.
  group: residual-diversity-scale-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scenario:
    if: >-
      !contains(github.event.head_commit.message,
      '[skip residual-diversity-scale]')
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # All eight declared scenarios, not the core 2x2 subset. The jobs run
        # in parallel, so the extra four cost runners rather than wall clock,
        # and they carry conditions the corpus has none of: three have a
        # dedicated priority container and two start pre-loaded. The
        # learnability audit splits by case, so this also takes it from four
        # folds to eight.
        scenario:
          - single-empty-noshelf
          - single-empty-shelf
          - single-preloaded
          - dual-empty
          - dual-shelf-mixed
          - dual-dedicated-priority
          - dual-preloaded-dedicated
          - dual-full-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify replay integration contract
        run: python -m unittest tests.test_replay_integration -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Build declared competition-condition matrix
        run: >-
          python scripts/build_scenario_matrix.py
          --look-ahead 20
          --policy-timeout 8
          --output-dir reports/residual-diversity-scale/configs
      - name: Replay safe-split portfolio
        run: >-
          python scripts/build_replay_dataset.py
          --config
          "reports/residual-diversity-scale/configs/${{ matrix.scenario }}.json"
          --case "m-${{ matrix.scenario }}"
          --steps ${{ inputs.steps || '3 6 9 12 15 18' }}
          --per-stratum 4
          --sampling-mode residual_diversity_safe_split
          --overdraw-factor 3
          --risk-gate-mode shadow
          --observed-swap-rounds ${{ inputs.observed_swap_rounds || '64' }}
          --max-seconds 7200
          --skip-optimize
          --output-dir
          "reports/residual-diversity-scale/${{ matrix.scenario }}/dataset"
      - name: Summarize paired physical coverage
        run: >-
          python scripts/summarize_residual_diversity_pilot.py
          --manifest
          "reports/residual-diversity-scale/${{ matrix.scenario }}/dataset/manifest.json"
          --json-output
          "reports/residual-diversity-scale/${{ matrix.scenario }}/summary.json"
          --markdown-output
          "reports/residual-diversity-scale/${{ matrix.scenario }}/summary.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-diversity-scale-${{ matrix.scenario }}
          path: reports/residual-diversity-scale/${{ matrix.scenario }}/

  aggregate:
    needs: scenario
    if: always() && needs.scenario.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: residual-diversity-scale-*
          path: reports/residual-diversity-scale/downloads
      - name: Aggregate without pooling condition failures
        run: |
          python scripts/summarize_residual_diversity_matrix.py \
            --root reports/residual-diversity-scale/downloads \
            --json-output reports/residual-diversity-scale/aggregate/summary.json \
            --markdown-output reports/residual-diversity-scale/aggregate/summary.md
          cat reports/residual-diversity-scale/aggregate/summary.md \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Measure the swap acceptance rule against its paired shadow
        run: |
          python scripts/measure_swap_acceptance.py \
            --root reports/residual-diversity-scale/downloads \
            --json-output \
              reports/residual-diversity-scale/aggregate/acceptance.json \
            --markdown-output \
              reports/residual-diversity-scale/aggregate/acceptance.md
          cat reports/residual-diversity-scale/aggregate/acceptance.md \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: residual-diversity-scale-aggregate
          path: reports/residual-diversity-scale/aggregate/
      - name: Persist matrix history and the labelled corpus
        env:
          HISTORY_DIR: >-
            reports/residual-diversity-scale/history/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$HISTORY_DIR"
          # The rows are the corpus. Artifacts expire 90 days after the run,
          # so a dataset that lives only there cannot be trained on later;
          # one matrix run is well under a megabyte compressed. Snapshots
          # come along because the trajectory is wall-clock dependent and a
          # discarded state cannot be regenerated.
          for scenario_dir in \
            reports/residual-diversity-scale/downloads/residual-diversity-scale-*/; do
            name="$(basename "$scenario_dir")"
            name="${name#residual-diversity-scale-}"
            if [ -d "$scenario_dir/dataset" ]; then
              mkdir -p "$HISTORY_DIR/dataset/$name"
              cp -R "$scenario_dir/dataset/." "$HISTORY_DIR/dataset/$name/"
            fi
          done
          cp reports/residual-diversity-scale/aggregate/summary.md \
            "$HISTORY_DIR/summary.md"
          cp reports/residual-diversity-scale/aggregate/summary.json \
            "$HISTORY_DIR/summary.json"
          # After the summary is in place: the index reads each run's verdict
          # from it, and would otherwise file every run as verdict null.
          #
          # The budget is the stop on unbounded growth. Over it, this run
          # keeps its verdict and drops its rows, loudly, rather than letting
          # the repository grow until someone notices. 2 GB raw is about
          # 140 MB stored at the measured 14.7x, i.e. roughly eighty runs.
          reindex() {
            if ! python scripts/index_replay_corpus.py \
                --root reports/residual-diversity-scale/history \
                --json-output reports/residual-diversity-scale/corpus.json \
                --markdown-output reports/residual-diversity-scale/corpus.md \
                --budget-bytes 2000000000; then
              echo "::warning::retained corpus is over budget; this run keeps \
                its summary and drops its rows. Prune older runs or raise the \
                budget deliberately."
              rm -rf "$HISTORY_DIR/dataset"
              python scripts/index_replay_corpus.py \
                --root reports/residual-diversity-scale/history \
                --json-output reports/residual-diversity-scale/corpus.json \
                --markdown-output reports/residual-diversity-scale/corpus.md
            fi
          }
          reindex
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY_DIR" \
            reports/residual-diversity-scale/corpus.json \
            reports/residual-diversity-scale/corpus.md
          git commit \
            -m "Record residual diversity matrix ${{ github.run_id }} [skip residual-diversity] [skip residual-diversity-scale]"
          # Runs are queued rather than cancelled now, so several can land
          # close together and race on this push. Losing the race means
          # losing that run's whole corpus, so retry further and back off.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::could not push the corpus after 6 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME"; then continue; fi
            # Each run writes its rows under a unique history/<run_id>/ path,
            # so two runs can never conflict on data. They conflict on the
            # index, which is DERIVED from the tree -- and merging two stale
            # renderings of it is meaningless. Rebuild it from the rebased
            # tree instead. Losing this race used to drop the whole run.
            for path in $(git diff --name-only --diff-filter=U); do
              case "$path" in
                reports/residual-diversity-scale/corpus.json) ;;
                reports/residual-diversity-scale/corpus.md) ;;
                *)
                  echo "::error::unexpected rebase conflict in $path"
                  git rebase --abort
                  exit 1
                  ;;
              esac
            done
            reindex
            git add reports/residual-diversity-scale/corpus.json \
              reports/residual-diversity-scale/corpus.md
            GIT_EDITOR=true git rebase --continue
          done

name: Residual-state diversity condition matrix

on:
  workflow_dispatch:
    inputs:
      observed_swap_rounds:
        description: >-
          Observed-state swap rounds for the safe-positive portfolio.
          0 dispatches the unseeded greedy construction as the ablation arm.
        required: false
        type: string
        default: "64"
  push:
    branches:
      - experiment/residual-diversity-dataset
      - claude/observed-state-swap-optimizer-lk8m0p

permissions:
  contents: read

concurrency:
  group: residual-diversity-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    if: >-
      !contains(github.event.head_commit.message,
      '[skip residual-diversity-scale]')
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - single-empty-noshelf
          - single-empty-shelf
          - dual-empty
          - dual-shelf-mixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify replay integration contract
        run: python -m unittest tests.test_replay_integration -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Build declared competition-condition matrix
        run: >-
          python scripts/build_scenario_matrix.py
          --look-ahead 20
          --policy-timeout 8
          --output-dir reports/residual-diversity-scale/configs
      - name: Replay safe-split portfolio
        run: >-
          python scripts/build_replay_dataset.py
          --config
          "reports/residual-diversity-scale/configs/${{ matrix.scenario }}.json"
          --case "m-${{ matrix.scenario }}"
          --steps 3 9 15
          --per-stratum 4
          --sampling-mode residual_diversity_safe_split
          --overdraw-factor 3
          --risk-gate-mode shadow
          --observed-swap-rounds ${{ inputs.observed_swap_rounds || '64' }}
          --skip-optimize
          --output-dir
          "reports/residual-diversity-scale/${{ matrix.scenario }}/dataset"
      - name: Summarize paired physical coverage
        run: >-
          python scripts/summarize_residual_diversity_pilot.py
          --manifest
          "reports/residual-diversity-scale/${{ matrix.scenario }}/dataset/manifest.json"
          --json-output
          "reports/residual-diversity-scale/${{ matrix.scenario }}/summary.json"
          --markdown-output
          "reports/residual-diversity-scale/${{ matrix.scenario }}/summary.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-diversity-scale-${{ matrix.scenario }}
          path: reports/residual-diversity-scale/${{ matrix.scenario }}/

  aggregate:
    needs: scenario
    if: always() && needs.scenario.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: residual-diversity-scale-*
          path: reports/residual-diversity-scale/downloads
      - name: Aggregate without pooling condition failures
        run: |
          python scripts/summarize_residual_diversity_matrix.py \
            --root reports/residual-diversity-scale/downloads \
            --json-output reports/residual-diversity-scale/aggregate/summary.json \
            --markdown-output reports/residual-diversity-scale/aggregate/summary.md
          cat reports/residual-diversity-scale/aggregate/summary.md \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: residual-diversity-scale-aggregate
          path: reports/residual-diversity-scale/aggregate/
      - name: Persist matrix history and the labelled corpus
        env:
          HISTORY_DIR: >-
            reports/residual-diversity-scale/history/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$HISTORY_DIR"
          # The rows are the corpus. Artifacts expire 90 days after the run,
          # so a dataset that lives only there cannot be trained on later;
          # one matrix run is well under a megabyte compressed. Snapshots
          # come along because the trajectory is wall-clock dependent and a
          # discarded state cannot be regenerated.
          for scenario_dir in \
            reports/residual-diversity-scale/downloads/residual-diversity-scale-*/; do
            name="$(basename "$scenario_dir")"
            name="${name#residual-diversity-scale-}"
            if [ -d "$scenario_dir/dataset" ]; then
              mkdir -p "$HISTORY_DIR/dataset/$name"
              cp -R "$scenario_dir/dataset/." "$HISTORY_DIR/dataset/$name/"
            fi
          done
          python scripts/index_replay_corpus.py \
            --root reports/residual-diversity-scale/history \
            --json-output reports/residual-diversity-scale/corpus.json \
            --markdown-output reports/residual-diversity-scale/corpus.md
          cp reports/residual-diversity-scale/aggregate/summary.md \
            "$HISTORY_DIR/summary.md"
          cp reports/residual-diversity-scale/aggregate/summary.json \
            "$HISTORY_DIR/summary.json"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY_DIR" \
            reports/residual-diversity-scale/corpus.json \
            reports/residual-diversity-scale/corpus.md
          git commit \
            -m "Record residual diversity matrix ${{ github.run_id }} [skip residual-diversity] [skip residual-diversity-scale]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
          done

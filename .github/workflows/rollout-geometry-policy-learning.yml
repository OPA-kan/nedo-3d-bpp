name: Rollout geometry policy learning
run-name: >-
  ${{ inputs.season_wave && format('Season w{0} · preference distillation', inputs.season_wave)
      || 'Rollout geometry policy learning' }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen terminal hard-state aggregate run
        required: false
        default: "32822842633"
      epochs:
        description: Training epochs per ensemble member
        required: false
        default: "30"
      collection_run_id:
        description: Collection run carried into the season ledger
        required: false
        default: ""
      season_wave:
        description: League season wave; empty keeps this a standalone run
        required: false
        default: ""
  # Dispatch-only during the league season: every round trains against
  # an explicit source_run_id once its collection wave has finished, so
  # an automatic push-triggered run against a stale default source
  # would only ever produce a mismatched matrix.

permissions:
  actions: read
  contents: read

concurrency:
  group: rollout-geometry-policy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  recover-actions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: dual-preloaded-dedicated-permute-000-17, scenario: dual-preloaded-dedicated, stream: permute-000-17}

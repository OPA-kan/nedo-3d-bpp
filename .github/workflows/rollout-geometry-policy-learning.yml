name: Rollout geometry policy learning

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen terminal hard-state aggregate run
        required: false
        default: "32813542943"
      epochs:
        description: Training epochs per ensemble member
        required: false
        default: "30"
  push:
    branches:
      - work/terminal-rollout-oracle
    paths:
      - .github/workflows/rollout-geometry-policy-learning.yml
      - scripts/recover_trigger_candidate_actions.py
      - scripts/attach_trigger_candidate_actions.py
      - scripts/train_rollout_trigger.py
      - scripts/run_terminal_rollout_policy.py
      - tests/test_attach_trigger_candidate_actions.py
      - tests/test_train_rollout_trigger.py
      - tests/test_rollout_geometry_policy_workflow.py

permissions:
  actions: read
  contents: read

concurrency:
  group: rollout-geometry-policy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  recover-actions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: dual-preloaded-dedicated-permute-000-17, scenario: dual-preloaded-dedicated, stream: permute-000-17}
          - {cell: dual-preloaded-dedicated-permute-000-29, scenario: dual-preloaded-dedicated, stream: permute-000-29}
          - {cell: dual-preloaded-dedicated-permute-000-41, scenario: dual-preloaded-dedicated, stream: permute-000-41}
          - {cell: dual-preloaded-dedicated-permute-000-53, scenario: dual-preloaded-dedicated, stream: permute-000-53}
          - {cell: dual-shelf-mixed-permute-001-23, scenario: dual-shelf-mixed, stream: permute-001-23}
          - {cell: dual-shelf-mixed-permute-001-31, scenario: dual-shelf-mixed, stream: permute-001-31}
          - {cell: dual-shelf-mixed-permute-001-43, scenario: dual-shelf-mixed, stream: permute-001-43}
          - {cell: dual-empty-permute-000-61, scenario: dual-empty, stream: permute-000-61}
          - {cell: dual-empty-permute-000-71, scenario: dual-empty, stream: permute-000-71}
          - {cell: single-empty-shelf-permute-001-73, scenario: single-empty-shelf, stream: permute-001-73}
          - {cell: single-empty-noshelf-permute-000-79, scenario: single-empty-noshelf, stream: permute-000-79}
          - {cell: single-preloaded-permute-000-89, scenario: single-preloaded, stream: permute-000-89}
          - {cell: dual-preloaded-dedicated-permute-000-97, scenario: dual-preloaded-dedicated, stream: permute-000-97}
          - {cell: dual-preloaded-dedicated-permute-000-103, scenario: dual-preloaded-dedicated, stream: permute-000-103}
          - {cell: dual-preloaded-dedicated-permute-000-109, scenario: dual-preloaded-dedicated, stream: permute-000-109}
          - {cell: dual-preloaded-dedicated-permute-000-127, scenario: dual-preloaded-dedicated, stream: permute-000-127}
          - {cell: dual-preloaded-dedicated-permute-000-137, scenario: dual-preloaded-dedicated, stream: permute-000-137}
          - {cell: dual-preloaded-dedicated-permute-000-151, scenario: dual-preloaded-dedicated, stream: permute-000-151}
          - {cell: dual-shelf-mixed-permute-001-59, scenario: dual-shelf-mixed, stream: permute-001-59}
          - {cell: dual-shelf-mixed-permute-001-67, scenario: dual-shelf-mixed, stream: permute-001-67}
          - {cell: dual-shelf-mixed-permute-001-83, scenario: dual-shelf-mixed, stream: permute-001-83}
          - {cell: dual-shelf-mixed-permute-001-101, scenario: dual-shelf-mixed, stream: permute-001-101}
          - {cell: dual-shelf-mixed-permute-001-107, scenario: dual-shelf-mixed, stream: permute-001-107}
          - {cell: dual-shelf-mixed-permute-001-113, scenario: dual-shelf-mixed, stream: permute-001-113}
          - {cell: dual-preloaded-dedicated-permute-000-157, scenario: dual-preloaded-dedicated, stream: permute-000-157}
          - {cell: dual-preloaded-dedicated-permute-000-163, scenario: dual-preloaded-dedicated, stream: permute-000-163}
          - {cell: dual-preloaded-dedicated-permute-000-167, scenario: dual-preloaded-dedicated, stream: permute-000-167}
          - {cell: dual-preloaded-dedicated-permute-000-173, scenario: dual-preloaded-dedicated, stream: permute-000-173}
          - {cell: dual-preloaded-dedicated-permute-000-179, scenario: dual-preloaded-dedicated, stream: permute-000-179}
          - {cell: dual-preloaded-dedicated-permute-000-181, scenario: dual-preloaded-dedicated, stream: permute-000-181}
          - {cell: dual-shelf-mixed-permute-001-127, scenario: dual-shelf-mixed, stream: permute-001-127}
          - {cell: dual-shelf-mixed-permute-001-139, scenario: dual-shelf-mixed, stream: permute-001-139}
          - {cell: dual-shelf-mixed-permute-001-149, scenario: dual-shelf-mixed, stream: permute-001-149}
          - {cell: dual-shelf-mixed-permute-001-151, scenario: dual-shelf-mixed, stream: permute-001-151}
          - {cell: dual-shelf-mixed-permute-001-157, scenario: dual-shelf-mixed, stream: permute-001-157}
          - {cell: dual-shelf-mixed-permute-001-163, scenario: dual-shelf-mixed, stream: permute-001-163}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Download frozen search teacher
        uses: actions/download-artifact@v4
        with:
          name: terminal-hard-state-aggregate-${{ inputs.source_run_id || '32813542943' }}
          path: reports/geometry-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || '32813542943' }}
      - name: Rebuild exact stream scenario
        run: >-
          python scripts/build_scenario_matrix.py
          --stream-variant "${{ matrix.stream }}"
          --output-dir reports/geometry-policy/configs/${{ matrix.cell }}
      - name: Recover candidate command actions
        run: >-
          python scripts/recover_trigger_candidate_actions.py
          --manifest reports/geometry-source/results/terminal-hard-state-cell-${{ matrix.cell }}/rollout/manifest.json
          --dataset reports/geometry-source/trigger-dataset.json
          --task-config reports/geometry-policy/configs/${{ matrix.cell }}/${{ matrix.scenario }}.json
          --cell terminal-hard-state-cell-${{ matrix.cell }}
          --attempt-budget 128
          --top-k 3
          --output reports/geometry-policy/${{ matrix.cell }}/actions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-policy-actions-${{ matrix.cell }}
          path: reports/geometry-policy/${{ matrix.cell }}/

  train:
    needs: recover-actions
    if: needs.recover-actions.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-learning.txt
      - run: pip install -r requirements.txt -r requirements-learning.txt
      - name: Verify geometry policy contracts
        run: >-
          python -m unittest
          tests.test_attach_trigger_candidate_actions
          tests.test_train_rollout_trigger
          tests.test_rollout_geometry_policy_workflow
          -v
      - name: Download frozen search teacher
        uses: actions/download-artifact@v4
        with:
          name: terminal-hard-state-aggregate-${{ inputs.source_run_id || '32813542943' }}
          path: reports/geometry-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || '32813542943' }}
      - uses: actions/download-artifact@v4
        with:
          pattern: geometry-policy-actions-*
          path: reports/geometry-policy/recovered
      - name: Attach action geometry to frozen teacher
        run: >-
          python scripts/attach_trigger_candidate_actions.py
          --dataset reports/geometry-source/trigger-dataset.json
          --recovery-root reports/geometry-policy/recovered
          --expected-cells 36
          --output reports/geometry-policy/trigger-dataset-with-actions.json
      - name: Train group-OOF geometry-only candidate policy
        run: >-
          python scripts/train_rollout_trigger.py
          --dataset reports/geometry-policy/trigger-dataset-with-actions.json
          --dataset-root reports/geometry-source/results
          --candidate-feature-mode geometry
          --folds 4
          --ensemble-size 3
          --repeats 3
          --epochs "${{ inputs.epochs || '30' }}"
          --dim 48
          --output reports/geometry-policy/oof-report.json
      - name: Publish geometry-only policy capability
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path(
              "reports/geometry-policy/oof-report.json"
          ).read_text())
          allocator = report["candidate_allocator"]
          print("# Geometry-only rollout candidate policy")
          print()
          print(f"- roots: {report['rows']}")
          print(f"- groups: {report['groups']}")
          print("- H1 physical outcomes used as input: no")
          print(f"- top-1 selected action accuracy: "
                f"{allocator['top1_selected_action_accuracy']:.4f}")
          print(f"- incumbent + one alternate intervention recall: "
                f"{allocator['intervention_alternative_top1_recall']:.4f}")
          print()
          print("Search outcomes are labels only; inference uses observed state "
                "and candidate action geometry.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-geometry-policy-${{ github.run_id }}
          path: reports/geometry-policy/

    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Download frozen search teacher
        uses: actions/download-artifact@v4
        with:
          name: terminal-hard-state-aggregate-${{ inputs.source_run_id || '32822842633' }}
          path: reports/geometry-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || '32822842633' }}
      - name: Rebuild exact stream scenario
        run: >-
          python scripts/build_scenario_matrix.py
          --stream-variant "${{ matrix.stream }}"
          --output-dir reports/geometry-policy/configs/${{ matrix.cell }}
      - name: Recover candidate command actions
        run: >-
          python scripts/recover_trigger_candidate_actions.py
          --manifest reports/geometry-source/results/terminal-hard-state-cell-${{ matrix.cell }}/rollout/manifest.json
          --dataset reports/geometry-source/trigger-dataset.json
          --task-config reports/geometry-policy/configs/${{ matrix.cell }}/${{ matrix.scenario }}.json
          --cell terminal-hard-state-cell-${{ matrix.cell }}
          --attempt-budget 128
          --top-k 3
          --output reports/geometry-policy/${{ matrix.cell }}/actions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-policy-actions-${{ matrix.cell }}
          path: reports/geometry-policy/${{ matrix.cell }}/

  train:
    needs: recover-actions
    if: needs.recover-actions.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-learning.txt
      - run: pip install -r requirements.txt -r requirements-learning.txt
      - name: Verify geometry policy contracts
        run: >-
          python -m unittest
          tests.test_attach_trigger_candidate_actions
          tests.test_train_rollout_trigger
          tests.test_rollout_geometry_policy_workflow
          -v
      - name: Download frozen search teacher
        uses: actions/download-artifact@v4
        with:
          name: terminal-hard-state-aggregate-${{ inputs.source_run_id || '32822842633' }}
          path: reports/geometry-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || '32822842633' }}
      - uses: actions/download-artifact@v4
        with:
          pattern: geometry-policy-actions-*
          path: reports/geometry-policy/recovered
      - name: Attach action geometry to frozen teacher
        run: >-
          python scripts/attach_trigger_candidate_actions.py
          --dataset reports/geometry-source/trigger-dataset.json
          --recovery-root reports/geometry-policy/recovered
          --expected-cells 136
          --output reports/geometry-policy/trigger-dataset-with-actions.json
      - name: Train group-OOF geometry-only candidate policy
        run: >-
          python scripts/train_rollout_trigger.py
          --dataset reports/geometry-policy/trigger-dataset-with-actions.json
          --dataset-root reports/geometry-source/results
          --candidate-feature-mode geometry
          --objective preference
          --folds 4
          --ensemble-size 3
          --repeats 3
          --epochs "${{ inputs.epochs || '30' }}"
          --dim 48
          --output reports/geometry-policy/oof-report.json
          --save-model-dir reports/geometry-policy/model
      - name: Publish geometry-only policy capability
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path(
              "reports/geometry-policy/oof-report.json"
          ).read_text())
          print("# Geometry-only rollout candidate policy")
          print()
          print(f"- roots: {report['rows']}")
          print(f"- groups: {report['groups']}")
          print("- H1 physical outcomes used as input: no")
          if "decision_rule" in report:
              rule = report["decision_rule"]
              print(f"- preference pairs: {report['pairs']} "
                    f"({report['positive_pairs']} positive)")
              print(f"- pair AUC: {report['pair_auc']:.4f}")
              print(f"- executed-selection agreement: "
                    f"{rule['executed_selection_agreement']:.4f}")
              print(f"- intervention action recall: "
                    f"{rule['intervention_action_recall']}")
              print(f"- false switch rate: {rule['false_switch_rate']}")
          else:
              allocator = report["candidate_allocator"]
              print(f"- top-1 selected action accuracy: "
                    f"{allocator['top1_selected_action_accuracy']:.4f}")
              print(f"- incumbent + one alternate intervention recall: "
                    f"{allocator['intervention_alternative_top1_recall']:.4f}")
          print()
          print("Search outcomes are labels only; inference uses observed state "
                "and candidate action geometry.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-geometry-policy-${{ github.run_id }}
          path: reports/geometry-policy/
      # The frozen deployable ensemble under the fixed name the league
      # match workflow downloads for its learned arm.
      - uses: actions/upload-artifact@v4
        with:
          name: rollout-policy-model
          path: reports/geometry-policy/model/

  continue-season:
    needs: train
    if: >-
      needs.train.result == 'success' &&
      inputs.season_wave != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the next production challenger
        id: identity
        shell: bash
        env:
          SEASON_WAVE: ${{ inputs.season_wave }}
        run: |
          python scripts/league_season.py identity \
            --registry reports/league/registry.json \
            --names reports/league/spectator/names.json \
            --wave "$SEASON_WAVE" > identity.json
          python - <<'PY'
          import json, os
          row = json.load(open("identity.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"challenger={row['id']}\n")
              out.write(f"display_name={row['display_name']}\n")
          PY
      - name: Dispatch the title match
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON_WAVE: ${{ inputs.season_wave }}
          COLLECTION_RUN: ${{ inputs.collection_run_id || inputs.source_run_id }}
          CHALLENGER: ${{ steps.identity.outputs.challenger }}
        run: >-
          gh workflow run league-match.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          -f policy=learned
          -f mode=challenge
          -f challenger_name="$CHALLENGER"
          -f model_run_id="$GITHUB_RUN_ID"
          -f model_artifact=rollout-policy-model
          -f collection_run_id="$COLLECTION_RUN"
          -f season_wave="$SEASON_WAVE"

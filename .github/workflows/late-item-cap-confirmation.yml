name: Late item cap independent confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/late-item-cap-confirmation.yml

permissions:
  contents: read

concurrency:
  group: late-item-cap-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-${{ matrix.source_case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source_case: ["000", "001"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build fresh permutation streams
        run: >-
          python scripts/build_stream_variants.py
          --source-case "${{ matrix.source_case }}"
          --look-ahead 15
          --variants 8
          --mode permute
          --seed 20260813
          --policy-timeout 8
          --output-dir
          "reports/late-item-cap-confirmation/source-${{ matrix.source_case }}/streams"
      - name: Run sequential paired confirmation
        run: >-
          python scripts/run_stream_paired.py
          --streams-dir
          "reports/late-item-cap-confirmation/source-${{ matrix.source_case }}/streams"
          --arm late_narrow_pool_cap16
          --run-dir
          "reports/late-item-cap-confirmation/source-${{ matrix.source_case }}/runs"
          --output
          "reports/late-item-cap-confirmation/source-${{ matrix.source_case }}/summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-item-cap-confirmation-source-${{ matrix.source_case }}
          path: reports/late-item-cap-confirmation/source-${{ matrix.source_case }}/

name: Counterfactual graph condition matrix

on:
  workflow_dispatch:
    inputs:
      environment_seed:
        description: "Simulator reset seed for an independent root trajectory"
        required: false
        default: "42"
      stream_variant:
        description: "Synthetic development item-stream variant"
        type: choice
        options:
          - original
          - source-001
          - reverse-000
          - interleave
          - rotate-000-7
          - rotate-001-5
          - permute-000-17
          - permute-000-29
          - permute-001-23
          - permute-001-31
          - permute-000-41
          - permute-000-53
          - permute-001-43
          - permute-001-59
          - permute-000-61
          - permute-001-67
          - permute-000-71
          - permute-000-79
          - permute-000-89
          - permute-000-97
          - permute-001-73
          - permute-001-83
          - permute-001-101
          - permute-001-107
          - permute-000-103
          - permute-000-109
          - permute-000-127
          - permute-000-137
          - permute-001-113
          - permute-001-127
          - permute-001-139
          - permute-001-149
          - permute-000-151
          - permute-000-157
          - permute-000-163
          - permute-000-167
          - permute-000-173
          - permute-000-179
          - permute-001-151
          - permute-001-157
          - permute-001-163
          - permute-001-167
          - permute-001-173
          - permute-001-179
          - permute-000-181
          - permute-000-191
          - permute-000-193
          - permute-000-197
          - permute-001-181
          - permute-001-191
          - permute-001-193
          - permute-001-197
        default: original
      graph_branch_factor:
        description: "Physical H3 branch width (B3 is the new teacher standard)"
        type: choice
        options:
          - "2"
          - "3"
        default: "3"
      graph_horizon:
        description: "Physical graph horizon (H4 is pilot-only)"
        type: choice
        options:
          - "3"
          - "4"
        default: "3"
      measurement_only:
        description: "Measure uncapped feasible visible items at the latest root"
        type: boolean
        default: false
  push:
    branches:
      - experiment/counterfactual-graph
    paths:
      - scripts/counterfactual_graph.py
      - scripts/build_counterfactual_graph.py
      - scripts/postshake_capture.py
      - scripts/build_replay_dataset.py
      - scripts/summarize_counterfactual_graph_matrix.py
      - scripts/summarize_counterfactual_graph_signal.py
      - scripts/build_counterfactual_teacher_pairs.py
      - scripts/build_trajectory_advantage_dataset.py
      - scripts/evaluate_trajectory_advantage_value.py
      - scripts/evaluate_counterfactual_teacher_baseline.py
      - scripts/evaluate_counterfactual_teacher_discovery.py
      - scripts/evaluate_counterfactual_teacher_frozen_policy.py
      - scripts/evaluate_counterfactual_afterstate_value.py
      - scripts/develop_post_shake_soft_reranker.py
      - scripts/evaluate_frozen_post_shake_soft_reranker.py
      - scripts/train_phase_conditioned_soft_policy.py
      - scripts/evaluate_prospective_phase_soft_policy.py
      - .github/workflows/counterfactual-graph-scale.yml

permissions:
  contents: read

concurrency:
  # Measurements must not be cancelled by a later push.
  group: counterfactual-graph-scale-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  graph:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The duplicated no-shelf row separates pool width from geometry.
          - label: single-noshelf-p10-s15
            scenario: single-empty-noshelf
            pool: 10
            root_steps: "6 12 15"
          - label: single-noshelf-p40-s15
            scenario: single-empty-noshelf
            pool: 40
            root_steps: "6 12 15"
          - label: single-shelf-p20-s15
            scenario: single-empty-shelf
            pool: 20
            root_steps: "6 12 15"
          - label: single-preloaded-p20-s15
            scenario: single-preloaded
            pool: 20
            root_steps: "6 9 12 15"
          - label: dual-empty-p20-s15
            scenario: dual-empty
            pool: 20
            root_steps: "6 12 15"
          - label: dual-shelf-p20-s15
            scenario: dual-shelf-mixed
            pool: 20
            root_steps: "6 12 15"
          - label: dual-preloaded-priority-p40-s15
            scenario: dual-preloaded-dedicated
            pool: 40
            root_steps: "6 12 15"
          - label: dual-full-stream-p40-s12
            scenario: dual-full-stream
            pool: 40
            root_steps: "6 9 12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify physical replay and attribute contracts
        run: >-
          python -m unittest
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e
          -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Build declared competition-condition config
        run: >-
          python scripts/build_scenario_matrix.py
          --look-ahead ${{ matrix.pool }}
          --policy-timeout 8
          --stream-variant ${{ inputs.stream_variant || 'original' }}
          --output-dir
          "reports/counterfactual-graph-scale/${{ matrix.label }}/configs"
      - name: Capture replayable mid/late root
        run: >-
          python scripts/build_replay_dataset.py
          --config
          "reports/counterfactual-graph-scale/${{ matrix.label }}/configs/${{ matrix.scenario }}.json"
          --case "m-${{ matrix.scenario }}"
          --steps ${{ matrix.root_steps }}
          --environment-seed ${{ inputs.environment_seed || '42' }}
          --snapshot-only
          --risk-gate-mode shadow
          --split development
          --skip-optimize
          --output-dir
          "reports/counterfactual-graph-scale/${{ matrix.label }}/root"
      - name: Expand every captured root as a bounded H3 physical graph
        if: ${{ inputs.measurement_only != true }}
        shell: bash
        run: |
          branch_factor="${{ inputs.graph_branch_factor || '3' }}"
          horizon="${{ inputs.graph_horizon || '3' }}"
          if [[ "$horizon" == "4" ]]; then
            test "$branch_factor" == "3"
            attempt_budget=1536
            max_nodes=121
            max_edges=120
          elif [[ "$branch_factor" == "3" ]]; then
            attempt_budget=512
            max_nodes=40
            max_edges=39
          else
            attempt_budget=256
            max_nodes=15
            max_edges=14
          fi
          mapfile -t snapshots < <(find \
            "reports/counterfactual-graph-scale/${{ matrix.label }}/root" \
            -maxdepth 1 -type f -name 'step-*-state.json' | sort)
          test "${#snapshots[@]}" -ge 1
          for snapshot in "${snapshots[@]}"; do
            step="$(basename "$snapshot" -state.json)"
            graph_dir="reports/counterfactual-graph-scale/${{ matrix.label }}/graphs/$step"
            mkdir -p "$graph_dir"
            python scripts/build_counterfactual_graph.py \
              --snapshot "$snapshot" \
              --config "reports/counterfactual-graph-scale/${{ matrix.label }}/configs/${{ matrix.scenario }}.json" \
              --case "m-${{ matrix.scenario }}" \
              --split development \
              --horizon "$horizon" \
              --branch-factor "$branch_factor" \
              --attempt-budget "$attempt_budget" \
              --max-nodes "$max_nodes" \
              --max-edges "$max_edges" \
              --post-shake-labels \
              --output "$graph_dir/graph.json"
          done
      - name: Measure uncapped feasible visible items at the latest root
        if: ${{ inputs.measurement_only == true }}
        shell: bash
        run: |
          root="reports/counterfactual-graph-scale/${{ matrix.label }}/root"
          snapshot="$(find "$root" -maxdepth 1 -type f -name 'step-*-state.json' | sort | tail -n 1)"
          test -n "$snapshot"
          mkdir -p "reports/counterfactual-graph-scale/${{ matrix.label }}/feasible-items"
          python scripts/measure_uncapped_feasible_items.py \
            --snapshot "$snapshot" \
            --config "reports/counterfactual-graph-scale/${{ matrix.label }}/configs/${{ matrix.scenario }}.json" \
            --case "m-${{ matrix.scenario }}" \
            --attempt-budget 512 \
            --item-scope all-visible \
            --split development \
            --output "reports/counterfactual-graph-scale/${{ matrix.label }}/feasible-items/all-visible.json"
          python scripts/measure_uncapped_feasible_items.py \
            --snapshot "$snapshot" \
            --config "reports/counterfactual-graph-scale/${{ matrix.label }}/configs/${{ matrix.scenario }}.json" \
            --case "m-${{ matrix.scenario }}" \
            --attempt-budget 512 \
            --item-scope live-cap \
            --split development \
            --output "reports/counterfactual-graph-scale/${{ matrix.label }}/feasible-items/live-cap.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterfactual-graph-scale-${{ matrix.label }}
          path: reports/counterfactual-graph-scale/${{ matrix.label }}/

  aggregate:
    needs: graph
    if: >-
      ${{ always() && needs.graph.result != 'skipped' &&
          inputs.measurement_only != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: counterfactual-graph-scale-*
          path: reports/counterfactual-graph-scale/downloads
      - name: Summarize without collapsing official-score proxies
        run: >-
          python scripts/summarize_counterfactual_graph_matrix.py
          --root reports/counterfactual-graph-scale/downloads
          --minimum-graphs 16
          --expected-conditions 8
          --json-output reports/counterfactual-graph-scale/aggregate/summary.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/summary.md
      - name: Audit bounded-H3 teacher signal
        run: >-
          python scripts/summarize_counterfactual_graph_signal.py
          --root reports/counterfactual-graph-scale/downloads
          --minimum-graphs 16
          --expected-conditions 8
          --run-id ${{ github.run_id }}
          --json-output reports/counterfactual-graph-scale/aggregate/signal.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/signal.md
      - name: Export source-state joined teacher pairs
        run: >-
          python scripts/build_counterfactual_teacher_pairs.py
          --signal reports/counterfactual-graph-scale/aggregate/signal.json
          --graph-root reports/counterfactual-graph-scale/downloads
          --expected-horizon ${{ inputs.graph_horizon || '3' }}
          --expected-branch-factor ${{ inputs.graph_branch_factor || '3' }}
          --output-dir reports/counterfactual-graph-scale/aggregate/teacher-pairs
      - name: Export direct candidate trajectory advantages
        run: >-
          python scripts/build_trajectory_advantage_dataset.py
          --graph-root reports/counterfactual-graph-scale/downloads
          --policy-generation baseline-${{ github.sha }}
          --expected-horizon ${{ inputs.graph_horizon || '3' }}
          --expected-branch-factor ${{ inputs.graph_branch_factor || '3' }}
          --output-dir reports/counterfactual-graph-scale/aggregate/trajectory-advantage
      - name: Validate trajectory advantage teacher contract
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path('reports/counterfactual-graph-scale/aggregate/trajectory-advantage/manifest.json');
          m=json.loads(p.read_text());
          assert m['row_count'] > 0;
          assert m['evaluation_group_fold_consistent'];
          assert m['rows_with_immediate_score_input'] == 0;
          assert m['rows_with_paired_action_tensors'] == m['row_count'];
          assert m['rows_with_paired_afterstate_tensors'] == m['row_count'];
          assert m['advantage_head_row_counts']['placed_count'] > 0;
          assert m['advantage_head_row_counts']['fill_score_proxy'] > 0;
          assert m['advantage_head_row_counts']['horizon_survival_rate'] > 0"
      - name: Evaluate direct advantage with whole-trajectory holdout
        run: >-
          python scripts/evaluate_trajectory_advantage_value.py
          --dataset reports/counterfactual-graph-scale/aggregate/trajectory-advantage/trajectory_advantage.jsonl
          --json-output reports/counterfactual-graph-scale/aggregate/trajectory-advantage-value.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/trajectory-advantage-value.md
      - name: Evaluate the first late-root learning baseline
        run: >-
          python scripts/evaluate_counterfactual_teacher_baseline.py
          --teacher-dir reports/counterfactual-graph-scale/aggregate/teacher-pairs
          --json-output reports/counterfactual-graph-scale/aggregate/baseline.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/baseline.md
      - name: Audit and freeze discovery-only state representations
        run: >-
          python scripts/evaluate_counterfactual_teacher_discovery.py
          --discovery reports/counterfactual-graph-scale/aggregate/teacher-pairs/discovery.jsonl
          --json-output reports/counterfactual-graph-scale/aggregate/discovery-audit.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/discovery-audit.md
          --policy-output reports/counterfactual-graph-scale/aggregate/discovery-policy.json
      - name: Evaluate the frozen policy once on this run's late roots
        run: >-
          python scripts/evaluate_counterfactual_teacher_frozen_policy.py
          --policy reports/counterfactual-teacher-discovery/policy.json
          --discovery reports/counterfactual-graph-scale/aggregate/teacher-pairs/discovery.jsonl
          --late reports/counterfactual-graph-scale/aggregate/teacher-pairs/late_holdout.jsonl
          --json-output reports/counterfactual-graph-scale/aggregate/frozen-policy-late.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/frozen-policy-late.md
      - name: Select post-shake soft afterstate model on discovery roots only
        run: >-
          python scripts/develop_post_shake_soft_reranker.py
          --discovery reports/counterfactual-graph-scale/aggregate/teacher-pairs/distributional_discovery.jsonl
          --json-output reports/counterfactual-graph-scale/aggregate/post-shake-soft-development.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/post-shake-soft-development.md
          --policy-output reports/counterfactual-graph-scale/aggregate/post-shake-soft-policy.json
      - name: Evaluate licensed frozen post-shake soft model once on late roots
        run: >-
          python scripts/evaluate_frozen_post_shake_soft_reranker.py
          --policy reports/counterfactual-graph-scale/aggregate/post-shake-soft-policy.json
          --discovery reports/counterfactual-graph-scale/aggregate/teacher-pairs/distributional_discovery.jsonl
          --late reports/counterfactual-graph-scale/aggregate/teacher-pairs/distributional_late_holdout.jsonl
          --json-output reports/counterfactual-graph-scale/aggregate/post-shake-soft-late.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/post-shake-soft-late.md
      - name: Evaluate the frozen previous-run phase policy prospectively
        run: >-
          python scripts/evaluate_prospective_phase_soft_policy.py
          --policy reports/counterfactual-afterstate-value/phase-soft-policy-32351615182.json
          --teacher-dir reports/counterfactual-graph-scale/aggregate/teacher-pairs
          --json-output reports/counterfactual-graph-scale/aggregate/phase-soft-prospective.json
          --markdown-output reports/counterfactual-graph-scale/aggregate/phase-soft-prospective.md
      - name: Validate physical afterstate teacher contract
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path('reports/counterfactual-graph-scale/aggregate/teacher-pairs/manifest.json');
          m=json.loads(p.read_text());
          assert m['schema_version'] >= 5;
          assert m['rows_with_paired_afterstate_tensors'] == m['informative_pair_rows'];
          assert m['rows_with_paired_continuation_distributions'] > 0;
          assert m['distributional_rows_with_paired_afterstate_tensors'] == m['rows_with_paired_continuation_distributions'];
          assert m['distributional_training_ready']"
      - run: cat reports/counterfactual-graph-scale/aggregate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/signal.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/baseline.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/discovery-audit.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/frozen-policy-late.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/post-shake-soft-development.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/post-shake-soft-late.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/phase-soft-prospective.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat reports/counterfactual-graph-scale/aggregate/trajectory-advantage-value.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: counterfactual-graph-scale-aggregate
          path: reports/counterfactual-graph-scale/aggregate/

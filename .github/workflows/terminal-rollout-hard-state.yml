      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-hard-state-cell-*
          path: reports/terminal-hard-state/results
      - name: Build trigger/allocation dataset
        run: >-
          python scripts/build_terminal_rollout_trigger_dataset.py
          --root reports/terminal-hard-state/results
          --expected-manifests 136
          --json-output reports/terminal-hard-state/trigger-dataset.json
          --markdown-output reports/terminal-hard-state/trigger-dataset.md
      - run: cat reports/terminal-hard-state/trigger-dataset.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4

name: Terminal-rollout hard-state collection

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: Maximum live placements per trajectory
        required: false
        default: "40"
  # A workflow_dispatch file is not addressable until it exists on the
  # default branch.  Keep a branch-local bootstrap trigger scoped only to
  # edits of this workflow; ordinary experiment-code pushes do not rerun it.
  push:
    branches:
      - work/terminal-rollout-oracle
    paths:
      - .github/workflows/terminal-rollout-hard-state.yml
      rollout_max_steps:
        description: Frozen rank-0 continuation cap; cap hits are censored
        required: false
        default: "40"

permissions:
  contents: read

concurrency:
  group: terminal-rollout-hard-state-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: dual-preloaded-dedicated-permute-000-17
            scenario: dual-preloaded-dedicated
            stream: permute-000-17
          - cell: dual-preloaded-dedicated-permute-000-29
            scenario: dual-preloaded-dedicated
            stream: permute-000-29
          - cell: dual-preloaded-dedicated-permute-000-41
            scenario: dual-preloaded-dedicated
            stream: permute-000-41
          - cell: dual-preloaded-dedicated-permute-000-53
            scenario: dual-preloaded-dedicated
            stream: permute-000-53
          - cell: dual-shelf-mixed-permute-001-23
            scenario: dual-shelf-mixed
            stream: permute-001-23
          - cell: dual-shelf-mixed-permute-001-31
            scenario: dual-shelf-mixed
            stream: permute-001-31
          - cell: dual-shelf-mixed-permute-001-43
            scenario: dual-shelf-mixed
            stream: permute-001-43
          - cell: dual-empty-permute-000-61
            scenario: dual-empty
            stream: permute-000-61
          - cell: dual-empty-permute-000-71
            scenario: dual-empty
            stream: permute-000-71
          - cell: single-empty-shelf-permute-001-73
            scenario: single-empty-shelf
            stream: permute-001-73
          - cell: single-empty-noshelf-permute-000-79
            scenario: single-empty-noshelf
            stream: permute-000-79
          - cell: single-preloaded-permute-000-89
            scenario: single-preloaded
            stream: permute-000-89
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify collector contracts
        run: >-
          python -m unittest
          tests.test_terminal_rollout_policy
          tests.test_terminal_rollout_trigger_dataset
          tests.test_terminal_rollout_hard_state_workflow
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e
          -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Build stream-diverse scenario
        run: >-
          python scripts/build_scenario_matrix.py
          --stream-variant "${{ matrix.stream }}"
          --output-dir reports/terminal-hard-state/configs
      - name: Collect V-free terminal-oracle roots
        shell: bash
        run: |
          set -euo pipefail
          out="reports/terminal-hard-state/${{ matrix.cell }}"
          python scripts/run_terminal_rollout_policy.py \
            --config "reports/terminal-hard-state/configs/${{ matrix.scenario }}.json" \
            --case "m-${{ matrix.scenario }}" \
            --environment-seed 42 \
            --attempt-budget 128 \
            --top-k 3 \
            --rollout-top-k 3 \
            --rollout-max-steps "${{ inputs.rollout_max_steps || '40' }}" \
            --max-steps "${{ inputs.max_steps || '40' }}" \
            --policy terminal-rollout \
            --output-dir "$out/rollout"
          cp "$out/rollout/manifest.json" "$out/rollout.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-hard-state-cell-${{ matrix.cell }}
          path: reports/terminal-hard-state/${{ matrix.cell }}/

  aggregate:
    needs: collect
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-hard-state-cell-*
          path: reports/terminal-hard-state/results
      - name: Build trigger/allocation dataset
        run: >-
          python scripts/build_terminal_rollout_trigger_dataset.py
          --root reports/terminal-hard-state/results
          --expected-manifests 12
          --json-output reports/terminal-hard-state/trigger-dataset.json
          --markdown-output reports/terminal-hard-state/trigger-dataset.md
      - run: cat reports/terminal-hard-state/trigger-dataset.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-hard-state-aggregate-${{ github.run_id }}
          path: reports/terminal-hard-state/

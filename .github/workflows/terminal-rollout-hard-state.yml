name: Terminal-rollout hard-state collection

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: Maximum live placements per trajectory
        required: false
        default: "40"
      rollout_max_steps:
        description: Frozen rank-0 continuation cap; cap hits are censored
        required: false
        default: "40"
  # A workflow_dispatch file is not addressable until it exists on the
  # default branch.  Keep a branch-local bootstrap trigger scoped only to
  # edits of this workflow; ordinary experiment-code pushes do not rerun it.
  push:
    branches:
      - work/terminal-rollout-oracle
    paths:
      - .github/workflows/terminal-rollout-hard-state.yml

permissions:
  contents: read


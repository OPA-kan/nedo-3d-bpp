name: Last-resort relaxation confirmation

on:
  workflow_dispatch:
  push:
    branches:
      - claude/v5-hypothesis-validation-cyna2c
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/last-resort-confirmation.yml

permissions:
  contents: read

concurrency:
  group: last-resort-confirmation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  episode:
    name: syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k20-${{ matrix.arm }}-r${{ matrix.replicate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [base, last_resort]
        replicate: [0, 1]
        source_case: ["000", "001"]
        variant: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build fresh permuted stream (seed 20260816)
        run: >-
          python scripts/build_stream_variants.py
          --source-case "${{ matrix.source_case }}"
          --look-ahead 20
          --variants 3
          --seed 20260816
          --output-dir "reports/last-resort-confirmation/variants-${{ matrix.source_case }}"
      - name: Run paired-arm episode member
        run: >-
          python scripts/run_risk_ablation.py
          --config "reports/last-resort-confirmation/variants-${{ matrix.source_case }}/syn${{ matrix.source_case }}-per0${{ matrix.variant }}-k20.json"
          --arm "${{ matrix.arm }}"
          --repeat "${{ matrix.replicate }}"
          --output-dir
          "reports/last-resort-confirmation/syn${{ matrix.source_case }}-per0${{ matrix.variant }}-${{ matrix.arm }}-r${{ matrix.replicate }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: >-
            last-resort-confirmation-syn${{ matrix.source_case }}-per0${{ matrix.variant }}-${{ matrix.arm }}-r${{ matrix.replicate }}
          path: >-
            reports/last-resort-confirmation/syn${{ matrix.source_case }}-per0${{ matrix.variant }}-${{ matrix.arm }}-r${{ matrix.replicate }}/

  aggregate:
    needs: episode
    if: always() && needs.episode.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: last-resort-confirmation-*
          path: reports/last-resort-confirmation/downloads
      - name: Combine and summarize
        run: |
          mkdir -p reports/last-resort-confirmation/aggregate
          find reports/last-resort-confirmation/downloads -name rows.jsonl \
            -type f -exec cat {} + \
            > reports/last-resort-confirmation/aggregate/rows.jsonl
          python scripts/run_risk_ablation.py \
            --summarize \
            --output-dir reports/last-resort-confirmation/aggregate
          cat reports/last-resort-confirmation/aggregate/summary.md \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: last-resort-confirmation-aggregate
          path: reports/last-resort-confirmation/aggregate/

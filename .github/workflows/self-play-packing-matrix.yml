name: Self-Play Packing scenario matrix

on:
  workflow_dispatch:
    inputs:
      environment_seed:
        description: "Simulator seed shared by every scenario"
        required: false
        default: "42"
      exploration_temperature:
        description: "Shared Top-K rank temperature"
        required: false
        default: "1.5"
  push:
    branches:
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/self-play-packing-matrix.yml
      - scripts/self_play_packing_game.py
      - scripts/run_self_play_packing.py
      - scripts/evaluate_self_play_packing.py
      - scripts/build_scenario_matrix.py
      - scripts/render_self_play_replay.py
      - scripts/select_critical_self_play_replays.py
      - tests/test_self_play_packing_game.py
      - tests/test_run_self_play_packing.py
      - tests/test_evaluate_self_play_packing.py
      - tests/test_render_self_play_replay.py
      - tests/test_select_critical_self_play_replays.py
      - tests/test_self_play_packing_matrix_workflow.py
      - docs/SELF_PLAY_PACKING_GAME.md

permissions:
  contents: read

concurrency:
  group: self-play-matrix-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  play:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - single-empty-noshelf
          - single-empty-shelf
          - dual-shelf-mixed
          - dual-preloaded-dedicated
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify game and physical contracts
        run: >-
          python -m unittest
          tests.test_self_play_packing_game
          tests.test_run_self_play_packing
          tests.test_evaluate_self_play_packing
          tests.test_render_self_play_replay
          tests.test_select_critical_self_play_replays
          tests.test_self_play_packing_matrix_workflow
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e
          -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Build shared scenario matrix
        run: >-
          python scripts/build_scenario_matrix.py
          --look-ahead 40
          --policy-timeout 8
          --stream-variant original
          --output-dir reports/self-play-matrix/configs
      - name: Run rank-0 control
        run: >-
          python scripts/run_self_play_packing.py
          --config reports/self-play-matrix/configs/${{ matrix.scenario }}.json
          --case m-${{ matrix.scenario }}
          --episodes 1
          --environment-seed ${{ inputs.environment_seed || '42' }}
          --game-seed 20260821
          --minimum-block 3
          --handoff-probability 0.6
          --attempt-budget 256
          --top-k 3
          --max-steps 18
          --selection-mode rank0
          --policy-generation pi0
          --output-dir reports/self-play-matrix/${{ matrix.scenario }}/rank0
      - name: Run symmetric exploration
        run: >-
          python scripts/run_self_play_packing.py
          --config reports/self-play-matrix/configs/${{ matrix.scenario }}.json
          --case m-${{ matrix.scenario }}
          --episodes 2
          --environment-seed ${{ inputs.environment_seed || '42' }}
          --game-seed 20260821
          --minimum-block 3
          --handoff-probability 0.6
          --attempt-budget 256
          --top-k 3
          --max-steps 18
          --selection-mode temperature
          --selection-temperature ${{ inputs.exploration_temperature || '1.5' }}
          --policy-generation pi0
          --output-dir reports/self-play-matrix/${{ matrix.scenario }}/temperature
      - name: Evaluate both arms
        shell: bash
        run: |
          python scripts/evaluate_self_play_packing.py \
            --manifest reports/self-play-matrix/${{ matrix.scenario }}/rank0/manifest.json \
            --json-output reports/self-play-matrix/${{ matrix.scenario }}/rank0-summary.json \
            --markdown-output reports/self-play-matrix/${{ matrix.scenario }}/rank0-summary.md
          python scripts/evaluate_self_play_packing.py \
            --manifest reports/self-play-matrix/${{ matrix.scenario }}/temperature/manifest.json \
            --json-output reports/self-play-matrix/${{ matrix.scenario }}/temperature-summary.json \
            --markdown-output reports/self-play-matrix/${{ matrix.scenario }}/temperature-summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-matrix-${{ matrix.scenario }}
          path: reports/self-play-matrix/${{ matrix.scenario }}/

  select-critical:
    needs: play
    if: always() && needs.play.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: self-play-matrix-single-empty-noshelf
          path: reports/self-play-matrix/single-empty-noshelf
      - uses: actions/download-artifact@v4
        with:
          name: self-play-matrix-single-empty-shelf
          path: reports/self-play-matrix/single-empty-shelf
      - uses: actions/download-artifact@v4
        with:
          name: self-play-matrix-dual-shelf-mixed
          path: reports/self-play-matrix/dual-shelf-mixed
      - uses: actions/download-artifact@v4
        with:
          name: self-play-matrix-dual-preloaded-dedicated
          path: reports/self-play-matrix/dual-preloaded-dedicated
      - name: Select and render learning-critical games
        run: >-
          python scripts/select_critical_self_play_replays.py
          --manifest single-empty-noshelf=reports/self-play-matrix/single-empty-noshelf/temperature/manifest.json
          --manifest single-empty-shelf=reports/self-play-matrix/single-empty-shelf/temperature/manifest.json
          --manifest dual-shelf-mixed=reports/self-play-matrix/dual-shelf-mixed/temperature/manifest.json
          --manifest dual-preloaded-dedicated=reports/self-play-matrix/dual-preloaded-dedicated/temperature/manifest.json
          --top-k 6
          --output-dir reports/self-play-matrix/critical
      - name: Publish selection
        shell: bash
        run: |
          echo '## Critical Self-Play replay gallery' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the aggregate artifact and open `critical/index.html`.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/self-play-matrix/critical/selection.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          test -f reports/self-play-matrix/critical/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: self-play-matrix-critical-${{ github.run_id }}
          path: reports/self-play-matrix/

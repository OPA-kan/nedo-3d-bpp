name: Wedge PPO

# Long training runs do not survive the interactive sandbox, which is
# recreated whenever the session idles.  This runs wedge_rl's PPO on a hosted
# runner for as long as the job limit allows and keeps the checkpoint and
# learning curve as artifacts.  A later run can start from the checkpoint of
# an earlier one via `init_run_id`.

on:
  # GitHub only registers a workflow once it has run on some ref; a file that
  # exists only on a feature branch cannot be dispatched by name (404).  The
  # first run came from a temporary push trigger; now that the workflow is
  # registered, runs are started by dispatch only, so ordinary pushes to the
  # environment code do not burn five runner-hours each.
  workflow_dispatch:
    inputs:
      region:
        description: Region to learn (wedge or shelf)
        type: string
        default: wedge
      layout:
        description: Container layout (c1 or c1s)
        type: string
        default: c1
      iterations:
        description: PPO iterations
        type: number
        default: 400
      episodes:
        description: Episodes per iteration
        type: number
        default: 32
      seed:
        description: Random seed
        type: number
        default: 0
      init_run_id:
        description: Run id of a previous Wedge PPO run whose policy to start from (optional)
        type: string
        default: ""
      init_artifact:
        description: Artifact name in that run holding policy.pt (default ppo-<region>-<layout>-s<seed>)
        type: string
        default: ""
      teacher_run_id:
        description: Run id of an Executor teacher run whose trajectories to imitate (optional)
        type: string
        default: ""
      teacher_weight:
        description: Imitation term weight in the PPO loss (with teacher)
        type: string
        default: "0.5"
      pretrain_epochs:
        description: Behaviour-cloning epochs before PPO (with teacher)
        type: string
        default: "10"

env:
  REGION: ${{ inputs.region || 'wedge' }}
  LAYOUT: ${{ inputs.layout || 'c1' }}
  ITERATIONS: ${{ inputs.iterations || 400 }}
  EPISODES: ${{ inputs.episodes || 32 }}
  SEED: ${{ inputs.seed || 0 }}
  INIT_RUN_ID: ${{ inputs.init_run_id || '' }}
  INIT_ARTIFACT: ${{ inputs.init_artifact || format('ppo-{0}-{1}-s{2}', inputs.region || 'wedge', inputs.layout || 'c1', inputs.seed || 0) }}
  TEACHER_RUN_ID: ${{ inputs.teacher_run_id || '' }}
  TEACHER_WEIGHT: ${{ inputs.teacher_weight || '0.5' }}
  PRETRAIN_EPOCHS: ${{ inputs.pretrain_epochs || '10' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: wedge-ppo-${{ github.ref }}-${{ inputs.region || 'wedge' }}-${{ inputs.seed || 0 }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Fetch the checkpoint to start from
        if: env.INIT_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INIT_ARTIFACT }}
          path: init
          run-id: ${{ env.INIT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Fetch the teacher trajectories
        if: env.TEACHER_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          pattern: teacher-${{ env.REGION }}-shard*
          path: teacher
          merge-multiple: true
          run-id: ${{ env.TEACHER_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Baselines on the evaluation seeds
        run: >-
          python -m wedge_rl baselines --region "$REGION" --layout "$LAYOUT" --episodes 40 --seed0 20000
          --out "reports/wedge/baselines-$REGION-$LAYOUT.json"
      - name: Train
        run: |
          init=""
          if [ -n "$INIT_RUN_ID" ]; then
            # the artifact keeps its run's directory layout (runs/<name>/policy.pt)
            init_pt=$(find init -name policy.pt | head -1)
            if [ -z "$init_pt" ]; then echo "no policy.pt in the init artifact"; find init | head; exit 1; fi
            init="--init $init_pt"
          fi
          if [ -n "$TEACHER_RUN_ID" ]; then
            init="$init --teacher teacher --teacher-weight $TEACHER_WEIGHT --pretrain-epochs $PRETRAIN_EPOCHS"
          fi
          # stop before the job limit so the evaluation and upload still run;
          # the best checkpoint and history.json are written as training goes.
          # --max-minutes ends the loop between iterations; the outer timeout
          # is a backstop (a SIGINT in the middle of the worker pool once left
          # the process hanging until the job limit, so it now kills after
          # a grace period).  Four collection processes: four vCPUs.
          timeout --signal=INT --kill-after=3m 310m python -m wedge_rl train \
            --region "$REGION" --layout "$LAYOUT" --iterations "$ITERATIONS" --episodes "$EPISODES" \
            --seed "$SEED" --workers 4 --max-minutes 290 \
            --out "runs/ppo-$REGION-$LAYOUT-s$SEED" $init || [ $? -eq 124 ] || [ $? -eq 137 ]
      - name: Evaluate against the baselines
        if: always()
        run: >-
          python -m wedge_rl eval --region "$REGION"
          --policy "runs/ppo-$REGION-$LAYOUT-s$SEED"
          --layout "$LAYOUT" --episodes 40 --seed0 20000
          --out "runs/ppo-$REGION-$LAYOUT-s$SEED/eval.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-${{ env.REGION }}-${{ env.LAYOUT }}-s${{ env.SEED }}
          path: |
            runs/ppo-${{ env.REGION }}-${{ env.LAYOUT }}-s${{ env.SEED }}/
            reports/wedge/

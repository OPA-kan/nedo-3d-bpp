name: Wedge PPO

# Long training runs do not survive the interactive sandbox, which is
# recreated whenever the session idles.  This runs wedge_rl's PPO on a hosted
# runner for as long as the job limit allows and keeps the checkpoint and
# learning curve as artifacts.  A later run can start from the checkpoint of
# an earlier one via `init_run_id`.

on:
  # GitHub only registers a workflow once it has run on some ref; a file that
  # exists only on a feature branch cannot be dispatched by name (404).  The
  # first run came from a temporary push trigger; now that the workflow is
  # registered, runs are started by dispatch only, so ordinary pushes to the
  # environment code do not burn five runner-hours each.
  workflow_dispatch:
    inputs:
      layout:
        description: Container layout (c1 or c1s)
        type: string
        default: c1
      iterations:
        description: PPO iterations
        type: number
        default: 400
      episodes:
        description: Episodes per iteration
        type: number
        default: 32
      seed:
        description: Random seed
        type: number
        default: 0
      init_run_id:
        description: Run id of a previous Wedge PPO run whose policy to start from (optional)
        type: string
        default: ""

env:
  LAYOUT: ${{ inputs.layout || 'c1' }}
  ITERATIONS: ${{ inputs.iterations || 400 }}
  EPISODES: ${{ inputs.episodes || 32 }}
  SEED: ${{ inputs.seed || 0 }}
  INIT_RUN_ID: ${{ inputs.init_run_id || '' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: wedge-ppo-${{ github.ref }}-${{ inputs.seed || 0 }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Fetch the checkpoint to start from
        if: env.INIT_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: wedge-ppo-${{ env.LAYOUT }}-s${{ env.SEED }}
          path: init
          run-id: ${{ env.INIT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Baselines on the evaluation seeds
        run: >-
          python -m wedge_rl baselines --layout "$LAYOUT" --episodes 40 --seed0 20000
          --out "reports/wedge/baselines-$LAYOUT.json"
      - name: Train
        run: |
          init=""
          if [ -n "$INIT_RUN_ID" ]; then init="--init init/policy.pt"; fi
          # stop before the job limit so the evaluation and upload still run;
          # the best checkpoint and history.json are written as training goes
          timeout --signal=INT 300m python -m wedge_rl train \
            --layout "$LAYOUT" --iterations "$ITERATIONS" --episodes "$EPISODES" --seed "$SEED" \
            --out "runs/wedge-ppo-$LAYOUT-s$SEED" $init || [ $? -eq 124 ]
      - name: Evaluate against the baselines
        if: always()
        run: >-
          python -m wedge_rl eval
          --policy "runs/wedge-ppo-$LAYOUT-s$SEED"
          --layout "$LAYOUT" --episodes 40 --seed0 20000
          --out "runs/wedge-ppo-$LAYOUT-s$SEED/eval.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wedge-ppo-${{ env.LAYOUT }}-s${{ env.SEED }}
          path: |
            runs/wedge-ppo-${{ env.LAYOUT }}-s${{ env.SEED }}/
            reports/wedge/

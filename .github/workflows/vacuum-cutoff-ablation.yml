name: Vacuum cutoff ablation

on:
  workflow_dispatch:
  push:
    branches:
      - claude/v5-hypothesis-validation-cyna2c
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/vacuum-cutoff-ablation.yml

permissions:
  contents: read

concurrency:
  group: vacuum-cutoff-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  episode:
    name: ${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [base, vacuum_cutoff]
        replicate: [0, 1, 2]
        case:
          # The certified-fatal pool-1 cases the mechanism targets, plus two
          # Task B configs as no-harm controls.
          - case_id: c000-k1
            source_case: "000"
            look_ahead: 1
          - case_id: c001-k1
            source_case: "001"
            look_ahead: 1
          - case_id: b000-k20
            source_case: "000"
            look_ahead: 20
          - case_id: b001-k20
            source_case: "001"
            look_ahead: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build development config
        run: >-
          python scripts/build_task_b_config.py
          --source-case "${{ matrix.case.source_case }}"
          --task-id "${{ matrix.case.case_id }}"
          --look-ahead "${{ matrix.case.look_ahead }}"
          --policy-timeout 8
          --output "reports/vacuum-cutoff/${{ matrix.case.case_id }}.json"
      - name: Run paired-arm episode member
        run: >-
          python scripts/run_risk_ablation.py
          --config "reports/vacuum-cutoff/${{ matrix.case.case_id }}.json"
          --arm "${{ matrix.arm }}"
          --repeat "${{ matrix.replicate }}"
          --output-dir
          "reports/vacuum-cutoff/${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: >-
            vacuum-cutoff-${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}
          path: >-
            reports/vacuum-cutoff/${{ matrix.case.case_id }}-${{ matrix.arm }}-r${{ matrix.replicate }}/

  aggregate:
    needs: episode
    if: always() && needs.episode.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: vacuum-cutoff-*
          path: reports/vacuum-cutoff/downloads
      - name: Combine and summarize
        run: |
          mkdir -p reports/vacuum-cutoff/aggregate
          find reports/vacuum-cutoff/downloads -name rows.jsonl \
            -type f -exec cat {} + \
            > reports/vacuum-cutoff/aggregate/rows.jsonl
          python scripts/run_risk_ablation.py \
            --summarize \
            --output-dir reports/vacuum-cutoff/aggregate
          cat reports/vacuum-cutoff/aggregate/summary.md \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vacuum-cutoff-aggregate
          path: reports/vacuum-cutoff/aggregate/

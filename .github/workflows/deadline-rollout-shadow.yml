name: Deadline-aware rollout shadow

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Frozen terminal hard-state aggregate run
        required: false
        default: "32811046786"
      allocator_run_id:
        description: Group-OOF candidate allocator run
        required: false
        default: "32811996191"
      allocator_artifact:
        description: Allocator artifact name in that run
        required: false
        default: "rollout-geometry-policy-32811996191"
      alternate_mode:
        description: Alternate branch selection (allocator or ranker_next)
        required: false
        default: "ranker_next"
      contested_extra_steps:
        description: Extra lockstep rounds for still-contested branches
        required: false
        default: "0"
      decision_budget_seconds:
        description: Total wall-clock budget per decision
        required: false
        default: "10.0"
  push:
    branches:
      - work/terminal-rollout-oracle
    paths:
      - .github/workflows/deadline-rollout-shadow.yml
      - scripts/deadline_physical_rollout.py
      - scripts/audit_deadline_rollout.py
      - scripts/aggregate_deadline_rollout.py
      - tests/test_deadline_physical_rollout.py
      - tests/test_audit_deadline_rollout.py
      - tests/test_aggregate_deadline_rollout.py

permissions:
  actions: read
  contents: read

concurrency:
  group: deadline-rollout-shadow-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: dual-preloaded-dedicated-permute-000-17, scenario: dual-preloaded-dedicated, stream: permute-000-17}
          - {cell: dual-preloaded-dedicated-permute-000-29, scenario: dual-preloaded-dedicated, stream: permute-000-29}
          - {cell: dual-preloaded-dedicated-permute-000-41, scenario: dual-preloaded-dedicated, stream: permute-000-41}
          - {cell: dual-preloaded-dedicated-permute-000-53, scenario: dual-preloaded-dedicated, stream: permute-000-53}
          - {cell: dual-shelf-mixed-permute-001-23, scenario: dual-shelf-mixed, stream: permute-001-23}
          - {cell: dual-shelf-mixed-permute-001-31, scenario: dual-shelf-mixed, stream: permute-001-31}
          - {cell: dual-shelf-mixed-permute-001-43, scenario: dual-shelf-mixed, stream: permute-001-43}
          - {cell: dual-empty-permute-000-61, scenario: dual-empty, stream: permute-000-61}
          - {cell: dual-empty-permute-000-71, scenario: dual-empty, stream: permute-000-71}
          - {cell: single-empty-shelf-permute-001-73, scenario: single-empty-shelf, stream: permute-001-73}
          - {cell: single-empty-noshelf-permute-000-79, scenario: single-empty-noshelf, stream: permute-000-79}
          - {cell: single-preloaded-permute-000-89, scenario: single-preloaded, stream: permute-000-89}
          - {cell: dual-preloaded-dedicated-permute-000-97, scenario: dual-preloaded-dedicated, stream: permute-000-97}
          - {cell: dual-preloaded-dedicated-permute-000-103, scenario: dual-preloaded-dedicated, stream: permute-000-103}
          - {cell: dual-preloaded-dedicated-permute-000-109, scenario: dual-preloaded-dedicated, stream: permute-000-109}
          - {cell: dual-preloaded-dedicated-permute-000-127, scenario: dual-preloaded-dedicated, stream: permute-000-127}
          - {cell: dual-preloaded-dedicated-permute-000-137, scenario: dual-preloaded-dedicated, stream: permute-000-137}
          - {cell: dual-preloaded-dedicated-permute-000-151, scenario: dual-preloaded-dedicated, stream: permute-000-151}
          - {cell: dual-shelf-mixed-permute-001-59, scenario: dual-shelf-mixed, stream: permute-001-59}
          - {cell: dual-shelf-mixed-permute-001-67, scenario: dual-shelf-mixed, stream: permute-001-67}
          - {cell: dual-shelf-mixed-permute-001-83, scenario: dual-shelf-mixed, stream: permute-001-83}
          - {cell: dual-shelf-mixed-permute-001-101, scenario: dual-shelf-mixed, stream: permute-001-101}
          - {cell: dual-shelf-mixed-permute-001-107, scenario: dual-shelf-mixed, stream: permute-001-107}
          - {cell: dual-shelf-mixed-permute-001-113, scenario: dual-shelf-mixed, stream: permute-001-113}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify deadline rollout contracts
        run: >-
          python -m unittest
          tests.test_deadline_physical_rollout
          tests.test_audit_deadline_rollout
          tests.test_aggregate_deadline_rollout
          -v
      - name: Download frozen terminal truth
        uses: actions/download-artifact@v4
        with:
          name: terminal-hard-state-aggregate-${{ inputs.source_run_id || '32811046786' }}
          path: reports/deadline-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || '32811046786' }}
      - name: Download group-OOF allocator
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.allocator_artifact || 'rollout-geometry-policy-32811996191' }}
          path: reports/deadline-allocator
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.allocator_run_id || '32811996191' }}
      - name: Rebuild exact stream scenario
        run: >-
          python scripts/build_scenario_matrix.py
          --stream-variant "${{ matrix.stream }}"
          --output-dir reports/deadline-rollout/configs/${{ matrix.cell }}
      - name: Run deadline-aware paired rollout
        run: >-
          python scripts/audit_deadline_rollout.py
          --manifest reports/deadline-source/results/terminal-hard-state-cell-${{ matrix.cell }}/rollout/manifest.json
          --trigger-dataset reports/deadline-source/trigger-dataset.json
          --oof-report reports/deadline-allocator/oof-report.json
          --task-config reports/deadline-rollout/configs/${{ matrix.cell }}/${{ matrix.scenario }}.json
          --cell terminal-hard-state-cell-${{ matrix.cell }}
          --candidate-budget 2
          --decision-budget-seconds "${{ inputs.decision_budget_seconds || '10.0' }}"
          --max-continuation-steps 2
          --contested-extra-steps "${{ inputs.contested_extra_steps || '0' }}"
          --safety-factor 1.35
          --alternate-mode "${{ inputs.alternate_mode || 'ranker_next' }}"
          --output reports/deadline-rollout/${{ matrix.cell }}/deadline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadline-rollout-cell-${{ matrix.cell }}
          path: reports/deadline-rollout/${{ matrix.cell }}/

  aggregate:
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: deadline-rollout-cell-*
          path: reports/deadline-rollout/results
      - name: Aggregate actual recall and wall clock
        run: >-
          python scripts/aggregate_deadline_rollout.py
          --root reports/deadline-rollout/results
          --expected-cells 24
          --json-output reports/deadline-rollout/aggregate.json
          --markdown-output reports/deadline-rollout/aggregate.md
      - run: cat reports/deadline-rollout/aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadline-rollout-aggregate-${{ github.run_id }}
          path: reports/deadline-rollout/aggregate.*

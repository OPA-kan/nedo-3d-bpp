name: Research Cup
run-name: >-
  Research Cup ${{ inputs.cup_id || '001' }} · teacher mining vs ${{ inputs.model_run_id }}

# Teacher-mining event, preregistered in
# reports/self-play-packing/research-cup-design.md. Dispatch-only and
# fully outside season 1: cup streams (primes 401+) are disjoint from
# the frozen eval variants and every preregistered wave, and nothing
# here writes to the season ledger, registry, or matrices. Each cell is
# run by the frozen champion (novelty baseline), the exact stateful current
# hand-coded agent, rule-alpha and the three compact rule studs.  Every
# diversity actor mines
# counterfactual dominance pairs against the champion ensemble at each
# action disagreement.
#
# Cup 009+ (Cup 009+ amendment in the design record): rule-alpha alone
# runs with its Layer 1 proposal family unioned into the candidate set
# and its own fork budget. The other five horses are untouched, so every
# cross-cup comparison except rule-alpha's stays exact.

on:
  workflow_dispatch:
    inputs:
      model_run_id:
        description: >-
          Actions run id whose rollout-policy-model artifact holds the
          frozen champion ensemble the studs mine against
        required: true
      model_artifact:
        description: Artifact name of the frozen policy model
        required: false
        default: "rollout-policy-model"
      mine_fork_budget:
        description: Counterfactual forks per stud episode
        required: false
        default: "12"
      rule_alpha_fork_budget:
        description: >-
          Counterfactual forks for the rule-alpha episode only. Held
          separate from mine_fork_budget so the other five horses stay
          bit-comparable with Cups 001-008; see the Cup 009+ amendment.
        required: false
        default: "40"
      rule_alpha_union_limit:
        description: >-
          rule-alpha proposal-family candidates unioned into the
          inference-side candidate set per state (0 disables the union)
        required: false
        default: "4"
      union_rollout_continuation:
        description: >-
          Widen the TEACHER's rollout continuation too. Cup 009 measured
          0 of 108 terminal rollouts reaching stream_exhausted -- 96.3%
          stopped at no_retained_candidate, which counts as a full
          board. WITHDRAWN as a default after Cup 010: three of six
          cells hit the 180-minute timeout, because the unioned
          candidate set multiplies the cost of every step inside a
          continuation that also grew 9 -> 18 steps. Left dispatchable,
          default off. Runs with this on are not comparable to Cups
          001-009.
        required: false
        default: "false"
      rollout_continuation_top_k:
        description: >-
          Cup 011+: make the champion ensemble the TEACHER's own rollout
          policy. The continuation retains this many safe candidates and
          the champion ranks them, instead of always taking rank-0. This
          is the policy-iteration arrow Cups 001-009 never had -- they
          improved the policy at the root and threw the improvement
          away, and five distillations moved held-out AUC 0.6125 ->
          0.6130. 1 leaves nothing to rank and is exactly the Cups
          001-009 teacher.
        required: false
        default: "1"
      cup_id:
        description: Cup number for the ledger (e.g. "002")
        required: false
        default: "001"
      cells:
        description: >-
          JSON array of {cell,scenario,stream} for the six-cell course.
          Streams must be fresh, never-reused primes from the 401-799
          pool (allocation ledger: reports/league/cup-ledger.md).
          Empty uses the Cup 001 course.
        required: false
        default: ""
  # Registration-only trigger: a dispatch-only workflow on a
  # non-default branch is never indexed (404 on dispatch) until it has
  # at least one run. Edits to this file produce an instantly-skipped
  # run; the guard below keeps push events from ever running the cup.
  push:
    branches:
      - work/terminal-rollout-oracle
    paths:
      - .github/workflows/diversity-cup.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: diversity-cup-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  episodes:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # the course comes from the dispatch input, so hosting a cup is
        # a dispatch plus a ledger row — never a code change; the
        # fallback below is the preregistered Cup 001 course
        include: >-
          ${{ fromJSON(inputs.cells || '[
            {"cell":"dual-preloaded-dedicated-permute-000-401","scenario":"dual-preloaded-dedicated","stream":"permute-000-401"},
            {"cell":"dual-empty-permute-000-419","scenario":"dual-empty","stream":"permute-000-419"},
            {"cell":"single-empty-noshelf-permute-000-431","scenario":"single-empty-noshelf","stream":"permute-000-431"},
            {"cell":"dual-shelf-mixed-permute-001-409","scenario":"dual-shelf-mixed","stream":"permute-001-409"},
            {"cell":"single-empty-shelf-permute-001-421","scenario":"single-empty-shelf","stream":"permute-001-421"},
            {"cell":"single-preloaded-permute-000-433","scenario":"single-preloaded","stream":"permute-000-433"}
          ]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - run: pip install -r requirements-learning.txt
      - name: Fetch frozen champion model
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.model_artifact }}
          run-id: ${{ inputs.model_run_id }}
          github-token: ${{ github.token }}
          path: reports/cup/model
      - name: Build cup scenario
        run: >-
          python scripts/build_scenario_matrix.py
          --stream-variant "${{ matrix.stream }}"
          --output-dir reports/cup/configs/${{ matrix.cell }}
      - name: Run the field (champion + current agent + rule-alpha + three studs)
        shell: bash
        run: |
          set -euo pipefail
          config="reports/cup/configs/${{ matrix.cell }}/${{ matrix.scenario }}.json"
          python scripts/run_terminal_rollout_policy.py \
            --config "$config" \
            --case m-${{ matrix.scenario }} \
            --environment-seed 42 \
            --attempt-budget 128 \
            --top-k 3 \
            --rollout-top-k 3 \
            --rollout-max-steps 40 \
            --max-steps 40 \
            --policy learned \
            ${{ inputs.union_rollout_continuation == 'true' && '--union-rollout-continuation' || '' }} \
            --rollout-continuation-top-k "${{ inputs.rollout_continuation_top_k || '1' }}" \
            ${{ (inputs.rollout_continuation_top_k || '1') != '1' && '--rollout-continuation-model-dir reports/cup/model' || '' }} \
            --model-dir reports/cup/model \
            --output-dir reports/cup/episodes/${{ matrix.cell }}/learned/rollout
          python scripts/run_terminal_rollout_policy.py \
            --config "$config" \
            --case m-${{ matrix.scenario }} \
            --environment-seed 42 \
            --attempt-budget 128 \
            --top-k 3 \
            --rollout-top-k 3 \
            --rollout-max-steps 40 \
            --max-steps 40 \
            --policy current-agent \
            ${{ inputs.union_rollout_continuation == 'true' && '--union-rollout-continuation' || '' }} \
            --rollout-continuation-top-k "${{ inputs.rollout_continuation_top_k || '1' }}" \
            ${{ (inputs.rollout_continuation_top_k || '1') != '1' && '--rollout-continuation-model-dir reports/cup/model' || '' }} \
            --mine-against-model reports/cup/model \
            --mine-fork-budget "${{ inputs.mine_fork_budget }}" \
            --output-dir reports/cup/episodes/${{ matrix.cell }}/current-agent/rollout
          python scripts/run_terminal_rollout_policy.py \
            --config "$config" \
            --case m-${{ matrix.scenario }} \
            --environment-seed 42 \
            --attempt-budget 128 \
            --top-k 3 \
            --rollout-top-k 3 \
            --rollout-max-steps 40 \
            --max-steps 40 \
            --policy rule-alpha \
            ${{ inputs.union_rollout_continuation == 'true' && '--union-rollout-continuation' || '' }} \
            --rollout-continuation-top-k "${{ inputs.rollout_continuation_top_k || '1' }}" \
            ${{ (inputs.rollout_continuation_top_k || '1') != '1' && '--rollout-continuation-model-dir reports/cup/model' || '' }} \
            --mine-against-model reports/cup/model \
            --mine-fork-budget "${{ inputs.rule_alpha_fork_budget || '40' }}" \
            --union-rule-alpha \
            --rule-alpha-union-limit "${{ inputs.rule_alpha_union_limit || '4' }}" \
            --output-dir reports/cup/episodes/${{ matrix.cell }}/rule-alpha/rollout
          for stud in rule-grid rule-lowcog rule-edge; do
            python scripts/run_terminal_rollout_policy.py \
              --config "$config" \
              --case m-${{ matrix.scenario }} \
              --environment-seed 42 \
              --attempt-budget 128 \
              --top-k 3 \
              --rollout-top-k 3 \
              --rollout-max-steps 40 \
              --max-steps 40 \
              --policy "$stud" \
              ${{ inputs.union_rollout_continuation == 'true' && '--union-rollout-continuation' || '' }} \
              --rollout-continuation-top-k "${{ inputs.rollout_continuation_top_k || '1' }}" \
              ${{ (inputs.rollout_continuation_top_k || '1') != '1' && '--rollout-continuation-model-dir reports/cup/model' || '' }} \
              --mine-against-model reports/cup/model \
              --mine-fork-budget "${{ inputs.mine_fork_budget }}" \
              --output-dir reports/cup/episodes/${{ matrix.cell }}/$stud/rollout
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-cell-${{ matrix.cell }}
          path: reports/cup/episodes/${{ matrix.cell }}/

  standings:
    needs: episodes
    if: always() && needs.episodes.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: cup-cell-*
          path: reports/cup/results
      - name: Score the cup
        run: >-
          python scripts/analyze_diversity_cup.py
          --root reports/cup/results
          --output reports/cup/out/cup-report.json
          --pairs-out reports/cup/out/side-corpus-pairs.jsonl
      - run: python -m json.tool reports/cup/out/cup-report.json | head -60 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-cup-result-${{ github.run_id }}
          path: reports/cup/out/

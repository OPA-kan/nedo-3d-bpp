name: Counterfactual exact-tie H5 diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/counterfactual-graph-tie-depth.yml

permissions:
  contents: read

jobs:
  graph:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: dual-empty-p20-step6
            scenario: dual-empty
            pool: 20
            root_steps: "6"
          - label: dual-full-p40-step6-9
            scenario: dual-full-stream
            pool: 40
            root_steps: "6 9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Build scenario config
        run: >-
          python scripts/build_scenario_matrix.py
          --look-ahead ${{ matrix.pool }}
          --policy-timeout 8
          --output-dir "reports/counterfactual-tie-h5/${{ matrix.label }}/configs"
      - name: Capture root-level exact-tie boards
        run: >-
          python scripts/build_replay_dataset.py
          --config "reports/counterfactual-tie-h5/${{ matrix.label }}/configs/${{ matrix.scenario }}.json"
          --case "m-${{ matrix.scenario }}"
          --steps ${{ matrix.root_steps }}
          --snapshot-only
          --risk-gate-mode shadow
          --split development
          --skip-optimize
          --output-dir "reports/counterfactual-tie-h5/${{ matrix.label }}/root"
      - name: Expand only selected tie roots to H5/B2
        shell: bash
        run: |
          mapfile -t snapshots < <(find \
            "reports/counterfactual-tie-h5/${{ matrix.label }}/root" \
            -maxdepth 1 -type f -name 'step-*-state.json' | sort)
          test "${#snapshots[@]}" -eq $(wc -w <<< "${{ matrix.root_steps }}")
          for snapshot in "${snapshots[@]}"; do
            step="$(basename "$snapshot" -state.json)"
            graph_dir="reports/counterfactual-tie-h5/${{ matrix.label }}/graphs/$step"
            mkdir -p "$graph_dir"
            python scripts/build_counterfactual_graph.py \
              --snapshot "$snapshot" \
              --config "reports/counterfactual-tie-h5/${{ matrix.label }}/configs/${{ matrix.scenario }}.json" \
              --case "m-${{ matrix.scenario }}" \
              --split development \
              --horizon 5 \
              --branch-factor 2 \
              --attempt-budget 256 \
              --max-nodes 63 \
              --max-edges 62 \
              --output "$graph_dir/graph.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterfactual-tie-h5-${{ matrix.label }}
          path: reports/counterfactual-tie-h5/${{ matrix.label }}/

  aggregate:
    needs: graph
    if: always() && needs.graph.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: counterfactual-tie-h5-*
          path: reports/counterfactual-tie-h5/downloads
      - name: Refuse partial targeted H5 diagnostic
        run: >-
          python scripts/summarize_counterfactual_graph_matrix.py
          --root reports/counterfactual-tie-h5/downloads
          --expected-graphs 3
          --json-output reports/counterfactual-tie-h5/aggregate/summary.json
          --markdown-output reports/counterfactual-tie-h5/aggregate/summary.md
      - name: Audit whether exact ties separate at H5
        run: >-
          python scripts/summarize_counterfactual_graph_signal.py
          --root reports/counterfactual-tie-h5/downloads
          --expected-graphs 3
          --run-id ${{ github.run_id }}
          --json-output reports/counterfactual-tie-h5/aggregate/signal.json
          --markdown-output reports/counterfactual-tie-h5/aggregate/signal.md
      - run: cat reports/counterfactual-tie-h5/aggregate/signal.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: counterfactual-tie-h5-aggregate
          path: reports/counterfactual-tie-h5/aggregate/

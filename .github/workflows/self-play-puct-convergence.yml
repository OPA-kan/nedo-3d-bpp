name: Targeted physical PUCT convergence

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: convergence, value, shake, shadow, component, or component-pair
        required: true
        default: "convergence"
      source_run_id:
        description: Successful Self-Play PUCT matrix run containing the 58 roots
        required: true
        default: "32515349437"
      candidate_rescue_limit:
        description: Searchable rescue width after Top-K physical exhaustion; 0 keeps shadow-only widening
        required: false
        default: "0"
      provider_zero_rescue_stride:
        description: Equal-budget stride used only after width-64 provider-zero; 0 disables
        required: false
        default: "0"
      provider_zero_rescue_safe_limit:
        description: Lazy PyBullet validation stops after this many safe rescue candidates
        required: false
        default: "1"
      baseline_convergence_run_id:
        description: Baseline convergence run; deep reference run in shadow mode
        required: false
        default: "32553551810"
      value_run_id:
        description: Set-value run for shadow; rescue convergence run for shake
        required: false
        default: ""
      expected_pairs:
        description: Expected changed root actions in one-step shake mode
        required: false
        default: "15"
  push:
    branches:
      - experiment/counterfactual-graph
    paths:
      - .github/workflows/self-play-puct-convergence.yml
      - scripts/evaluate_self_play_puct_convergence.py
      - scripts/evaluate_adaptive_puct_schedule.py
      - scripts/compare_self_play_puct_rescue.py
      - scripts/rerun_self_play_puct_roots.py
      - scripts/run_self_play_packing.py
      - scripts/evaluate_self_play_component_value_shadow.py
      - scripts/evaluate_self_play_component_paired_continuation.py
      - scripts/aggregate_self_play_component_paired_continuation.py
      - tests/test_evaluate_self_play_puct_convergence.py
      - tests/test_evaluate_adaptive_puct_schedule.py
      - tests/test_compare_self_play_puct_rescue.py
      - tests/test_self_play_puct_convergence_workflow.py
      - tests/test_run_self_play_packing.py
      - tests/test_evaluate_self_play_component_value_shadow.py
      - tests/test_evaluate_self_play_component_paired_continuation.py

permissions:
  contents: read
  actions: read

concurrency:
  group: self-play-puct-convergence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  targeted-rerun:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.experiment || 'convergence') == 'convergence') ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip convergence]'))
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify convergence contracts
        run: >-
          python -m unittest
          tests.test_evaluate_self_play_puct_convergence
          tests.test_evaluate_adaptive_puct_schedule
          tests.test_compare_self_play_puct_rescue
          tests.test_self_play_puct_convergence_workflow
          tests.test_run_self_play_packing
          tests.test_self_play_packing_search
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e
          -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Download the frozen source roots
        shell: bash
        run: >-
          gh run download "${{ inputs.source_run_id || '32515349437' }}"
          --name "self-play-puct-matrix-aggregate-${{ inputs.source_run_id || '32515349437' }}"
          --dir reports/source-puct-matrix
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Re-search assigned Q-discriminating roots
        run: >-
          python scripts/rerun_self_play_puct_roots.py
          --source-root reports/source-puct-matrix
          --expected-roots 58
          --candidate-audit-limit 64
          --candidate-rescue-limit ${{ inputs.candidate_rescue_limit || '0' }}
          --provider-zero-rescue-stride ${{ inputs.provider_zero_rescue_stride || '0' }}
          --provider-zero-rescue-limit 64
          --provider-zero-rescue-safe-limit ${{ inputs.provider_zero_rescue_safe_limit || '1' }}
          --shard-index ${{ matrix.shard_index }}
          --shard-count 8
          --output reports/puct-convergence/convergence-shard-${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-puct-convergence-shard-${{ matrix.shard_index }}
          path: reports/puct-convergence/

  aggregate:
    needs: targeted-rerun
    if: always() && needs.targeted-rerun.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download paired candidate-support baseline
        shell: bash
        run: >-
          gh run download "${{ inputs.baseline_convergence_run_id || '32553551810' }}"
          --name "self-play-puct-convergence-aggregate-${{ inputs.baseline_convergence_run_id || '32553551810' }}"
          --dir reports/baseline-puct-convergence
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: self-play-puct-convergence-shard-*
          path: reports/puct-convergence
          merge-multiple: true
      - name: Aggregate convergence evidence
        run: >-
          python scripts/evaluate_self_play_puct_convergence.py
          --root reports/puct-convergence
          --expected-roots 58
          --json-output reports/puct-convergence/aggregate.json
          --markdown-output reports/puct-convergence/aggregate.md
      - name: Evaluate adaptive H/S schedule
        run: >-
          python scripts/evaluate_adaptive_puct_schedule.py
          --root reports/puct-convergence
          --expected-roots 58
          --json-output reports/puct-convergence/adaptive-schedule.json
          --markdown-output reports/puct-convergence/adaptive-schedule.md
      - name: Compare searchable candidate-support arms
        if: >-
          ${{ (inputs.candidate_rescue_limit || '0') != '0' ||
              (inputs.provider_zero_rescue_stride || '0') != '0' }}
        run: >-
          python scripts/compare_self_play_puct_rescue.py
          --baseline reports/baseline-puct-convergence/aggregate.json
          --rescue reports/puct-convergence/aggregate.json
          --json-output reports/puct-convergence/rescue-comparison.json
          --markdown-output reports/puct-convergence/rescue-comparison.md
      - name: Publish bounded-search verdict
        shell: bash
        run: >-
          cat reports/puct-convergence/aggregate.md
          reports/puct-convergence/adaptive-schedule.md
          >> "$GITHUB_STEP_SUMMARY"
      - name: Publish searchable-rescue comparison
        if: >-
          ${{ (inputs.candidate_rescue_limit || '0') != '0' ||
              (inputs.provider_zero_rescue_stride || '0') != '0' }}
        shell: bash
        run: cat reports/puct-convergence/rescue-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-puct-convergence-aggregate-${{ github.run_id }}
          path: reports/puct-convergence/

  train-behavior-value:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.experiment == 'value'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-learning.txt
      - run: pip install -r requirements.txt -r requirements-learning.txt
      - name: Verify behavior-value and Set Transformer contracts
        run: >-
          python -m unittest
          tests.test_build_self_play_pv_dataset
          tests.test_train_self_play_set_value
          -v
      - name: Download played Self-Play trajectories
        run: >-
          gh run download "${{ inputs.source_run_id }}"
          --name "self-play-puct-matrix-aggregate-${{ inputs.source_run_id }}"
          --dir reports/source-puct-matrix
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Rebuild behavior-policy value dataset
        run: >-
          python scripts/build_self_play_pv_dataset.py
          --root reports/source-puct-matrix
          --output reports/self-play-set-value/pv-dataset.jsonl
          --summary reports/self-play-set-value/pv-dataset-summary.json
      - name: Train group-excluded ensemble V
        run: >-
          python scripts/train_self_play_set_value.py
          --dataset reports/self-play-set-value/pv-dataset.jsonl
          --output-dir reports/self-play-set-value/model
          --ensemble-size 3 --epochs 120 --folds 5
      - run: python -m json.tool reports/self-play-set-value/model/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-set-value-${{ github.run_id }}
          path: reports/self-play-set-value/

  one-step-paired-shake:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.experiment == 'shake'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify one-step shake contracts
        run: >-
          python -m unittest
          tests.test_evaluate_one_step_paired_shake
          tests.test_evaluate_paired_matched_shake
          tests.test_postshake_capture
          tests.test_attribute_placement_pybullet_e2e
          tests.test_replay_integration -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Download frozen source roots
        run: >-
          gh run download "${{ inputs.source_run_id }}"
          --name "self-play-puct-matrix-aggregate-${{ inputs.source_run_id }}"
          --dir reports/source-puct-matrix
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download baseline convergence aggregate
        run: >-
          gh run download "${{ inputs.baseline_convergence_run_id }}"
          --name "self-play-puct-convergence-aggregate-${{ inputs.baseline_convergence_run_id }}"
          --dir reports/baseline-puct-convergence
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download rescue convergence aggregate
        run: >-
          gh run download "${{ inputs.value_run_id }}"
          --name "self-play-puct-convergence-aggregate-${{ inputs.value_run_id }}"
          --dir reports/rescue-puct-convergence
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Force each changed action once and shake immediately
        run: >-
          python scripts/evaluate_one_step_paired_shake.py
          --source-root reports/source-puct-matrix
          --baseline reports/baseline-puct-convergence/aggregate.json
          --rescue reports/rescue-puct-convergence/aggregate.json
          --expected-pairs "${{ inputs.expected_pairs }}"
          --json-output reports/one-step-paired-shake/result.json
          --markdown-output reports/one-step-paired-shake/result.md
      - run: cat reports/one-step-paired-shake/result.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-one-step-paired-shake-${{ github.run_id }}
          path: reports/one-step-paired-shake/

  value-shadow:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.experiment == 'shadow'
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-simulator.txt
            requirements-learning.txt
      - run: pip install -r requirements-simulator.txt -r requirements-learning.txt
      - name: Verify fixed-support leaf-value contracts
        run: >-
          python -m unittest
          tests.test_train_self_play_set_value
          tests.test_evaluate_self_play_value_shadow
          tests.test_run_self_play_packing
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Download frozen source roots
        run: >-
          gh run download "${{ inputs.source_run_id }}"
          --name "self-play-puct-matrix-aggregate-${{ inputs.source_run_id }}"
          --dir reports/source-puct-matrix
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download frozen deep reference
        run: >-
          gh run download "${{ inputs.baseline_convergence_run_id }}"
          --name "self-play-puct-convergence-aggregate-${{ inputs.baseline_convergence_run_id }}"
          --dir reports/reference-puct-convergence
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download behavior-value ensemble
        run: >-
          gh run download "${{ inputs.value_run_id }}"
          --name "self-play-set-value-${{ inputs.value_run_id }}"
          --dir reports/self-play-set-value
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compare H2+V with H2+0 under identical support
        run: >-
          python scripts/evaluate_self_play_value_shadow.py
          --source-root reports/source-puct-matrix
          --reference reports/reference-puct-convergence/aggregate.json
          --model-dir reports/self-play-set-value/model
          --expected-roots 58
          --shard-index ${{ matrix.shard_index }} --shard-count 8
          --output reports/value-shadow/value-shadow-shard-${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-value-shadow-shard-${{ matrix.shard_index }}
          path: reports/value-shadow/

  aggregate-value-shadow:
    needs: value-shadow
    if: always() && needs.value-shadow.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: self-play-value-shadow-shard-*
          path: reports/value-shadow
          merge-multiple: true
      - name: Aggregate paired shadow evidence
        run: >-
          python scripts/aggregate_self_play_value_shadow.py
          --root reports/value-shadow --expected-roots 58
          --json-output reports/value-shadow/aggregate.json
          --markdown-output reports/value-shadow/aggregate.md
      - run: cat reports/value-shadow/aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-value-shadow-aggregate-${{ github.run_id }}
          path: reports/value-shadow/

  component-value-shadow:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.experiment == 'component'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-learning.txt
      - run: pip install -r requirements.txt -r requirements-learning.txt
      - name: Verify component-value contracts
        run: >-
          python -m unittest
          tests.test_evaluate_self_play_component_value_shadow
          tests.test_train_self_play_set_value -v
      - name: Download fresh multi-head source dataset
        run: >-
          gh run download "${{ inputs.source_run_id }}"
          --name "self-play-puct-matrix-aggregate-${{ inputs.source_run_id }}"
          --dir reports/component-source
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download group-excluded multi-head ensemble
        run: >-
          gh run download "${{ inputs.value_run_id }}"
          --name "self-play-set-value-${{ inputs.value_run_id }}"
          --dir reports/component-model
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Evaluate partial official-vector proposals
        run: >-
          python scripts/evaluate_self_play_component_value_shadow.py
          --dataset reports/component-source/pv-dataset.jsonl
          --model-dir reports/component-model/model
          --beta 1.0
          --json-output reports/component-value-shadow/result.json
          --markdown-output reports/component-value-shadow/result.md
      - run: cat reports/component-value-shadow/result.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-component-value-shadow-${{ github.run_id }}
          path: reports/component-value-shadow/

  component-paired-continuation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.experiment == 'component-pair'
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulator.txt
      - run: pip install -r requirements-simulator.txt
      - name: Verify paired component contracts
        run: >-
          python -m unittest
          tests.test_evaluate_self_play_component_value_shadow
          tests.test_evaluate_self_play_component_paired_continuation
          tests.test_build_paired_search_follow
          tests.test_replay_integration
          tests.test_attribute_placement_pybullet_e2e -v
        env:
          NEDO_REQUIRE_INTEGRATION: "1"
      - name: Download fresh source trajectories
        run: >-
          gh run download "${{ inputs.source_run_id }}"
          --name "self-play-puct-matrix-aggregate-${{ inputs.source_run_id }}"
          --dir reports/component-source
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download frozen component shadow
        run: >-
          gh run download "${{ inputs.value_run_id }}"
          --name "self-play-component-value-shadow-${{ inputs.value_run_id }}"
          --dir reports/component-shadow
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run paired terminal continuations and shake
        run: >-
          python scripts/evaluate_self_play_component_paired_continuation.py
          --shadow reports/component-shadow/result.json
          --dataset reports/component-source/pv-dataset.jsonl
          --source-root reports/component-source
          --beta 0.25
          --shard-index "${{ matrix.shard_index }}" --shard-count 2
          --output-dir reports/component-paired/shard-${{ matrix.shard_index }}
          --json-output reports/component-paired/shard-${{ matrix.shard_index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-paired-shard-${{ matrix.shard_index }}
          path: reports/component-paired/

  aggregate-component-paired:
    needs: component-paired-continuation
    if: >-
      always() && needs.component-paired-continuation.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: component-paired-shard-*
          path: reports/component-paired
          merge-multiple: true
      - name: Aggregate component-vector evidence
        run: >-
          python scripts/aggregate_self_play_component_paired_continuation.py
          --root reports/component-paired
          --expected-proposals "${{ inputs.expected_pairs }}"
          --json-output reports/component-paired/aggregate.json
          --markdown-output reports/component-paired/aggregate.md
      - run: cat reports/component-paired/aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-play-component-paired-${{ github.run_id }}
          path: reports/component-paired/
